apiVersion: apps/v1
kind: Deployment
metadata:
  name: openapi-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openapi-server
  template:
    metadata:
      labels:
        app: openapi-server
    spec:
      containers:
        - name: openapi-server
          image: openapi-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: '8080'
---
apiVersion: v1
kind: Service
metadata:
  name: openapi-service
  namespace: default
spec:
  selector:
    app: openapi-server
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: openapi-vs
  namespace: default
spec:
  hosts:
    - '*'
  gateways:
    - istio-system/monitoring-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: openapi-service.default.svc.cluster.local
            port:
              number: 8080
