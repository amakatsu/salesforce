## 📋 教育的レビューフレームワーク

### 🌟 良い点の認識と評価

**コード品質で評価すべき点:**
```python
# 良い例を見つけたら積極的に評価
def calculate_tax(price: float, tax_rate: float) -> float:
    """価格に税率を適用して税込み価格を計算します。"""
    if price < 0:
        raise ValueError("価格は0以上である必要があります")

    return price * (1 + tax_rate)

# 評価ポイント:
# ✅ 型ヒントの使用
# ✅ docstringによる説明
# ✅ 入力値検証
# ✅ 明確な関数名
```

**評価コメント例:**
```
🌟 素晴らしい実装です！

以下の点が特に良いです：
- 型ヒント（Type Hints）により、関数の使い方が明確
- docstringで関数の目的を説明
- 入力値検証でエラー処理を適切に実装
- 関数名が処理内容を正確に表現

これらは Python のベストプラクティスに完全に準拠した実装です。
```

### 🔧 改善提案（教育的アプローチ）

#### レベル1: 基本的な問題
```python
# 改善前
def calc(x, y):
    return x + y * 0.1

# 改善後
def calculate_price_with_tax(base_price: float, tax_rate: float = 0.1) -> float:
    """
    基本価格に税金を加算した価格を計算します。

    Args:
        base_price: 基本価格（税抜き）
        tax_rate: 税率（デフォルト: 0.1 = 10%）

    Returns:
        税込み価格

    Examples:
        >>> calculate_price_with_tax(1000)
        1100.0
        >>> calculate_price_with_tax(1000, 0.08)
        1080.0
    """
    if base_price < 0:
        raise ValueError("基本価格は0以上である必要があります")

    return base_price * (1 + tax_rate)
```

**教育的説明:**
```
📚 命名とドキュメンテーションの改善

【学習ポイント】
1. **関数名の重要性**
   - `calc` → `calculate_price_with_tax`
   - 関数名だけで何をするかが分かるように

2. **型ヒント（Type Hints）**
   - Python 3.5以降の機能
   - コードの可読性とIDE補完を向上
   - mypy等の静的型チェックツールで検証可能

3. **docstring（PEP 257準拠）**
   - 関数の目的、引数、戻り値を説明
   - Examples セクションで使用例を提示
   - help(関数名) で確認可能

4. **入力値検証**
   - 不正な値での予期しない動作を防止
   - エラーメッセージは日本語で分かりやすく

【参考資料】
- PEP 8: https://pep8-ja.readthedocs.io/
- Type Hints: https://docs.python.org/ja/3/library/typing.html
- Docstring: https://pep257-ja.readthedocs.io/
```

#### レベル2: 設計・アーキテクチャ
```python
# 改善前: 責任が混在
class User:
    def __init__(self, name: str, email: str):
        self.name = name
        self.email = email

    def save_to_database(self):
        # データベース保存処理
        pass

    def send_email(self):
        # メール送信処理
        pass

# 改善後: 単一責任原則に従った設計
class User:
    """ユーザー情報を表現するエンティティクラス"""
    def __init__(self, name: str, email: str):
        self.name = name
        self.email = email

    def __str__(self) -> str:
        return f"User(name={self.name}, email={self.email})"

class UserRepository:
    """ユーザーデータの永続化を担当"""
    def save(self, user: User) -> None:
        # データベース保存処理
        pass

class EmailService:
    """メール送信を担当"""
    def send_welcome_email(self, user: User) -> None:
        # メール送信処理
        pass
```

**教育的説明:**
```
🏗️ SOLID原則の適用

【学習ポイント】
1. **単一責任原則 (Single Responsibility Principle)**
   - 1つのクラスは1つの責任のみを持つ
   - User: ユーザー情報の管理
   - UserRepository: データ永続化
   - EmailService: メール送信

2. **関心の分離 (Separation of Concerns)**
   - ビジネスロジック、データアクセス、外部サービスを分離
   - テストが書きやすくなる
   - 変更時の影響範囲を限定

3. **依存関係の管理**
   - 各クラスは独立してテスト可能
   - モックしやすい設計

【設計パターン】
- Repository Pattern: データアクセスの抽象化
- Service Layer: ビジネスロジックの集約

【参考資料】
- Clean Architecture: https://blog.cleancoder.com/
- SOLID原則: https://en.wikipedia.org/wiki/SOLID
```

### 🧪 テスト設計の教育

```python
# テストの書き方指導
import pytest
from unittest.mock import Mock

class TestUserService:
    """UserServiceのテストクラス"""

    def test_create_user_success(self):
        """正常系: ユーザー作成が成功する"""
        # Arrange (準備)
        user_repo = Mock()
        email_service = Mock()
        service = UserService(user_repo, email_service)

        # Act (実行)
        result = service.create_user("田中太郎", "tanaka@example.com")

        # Assert (検証)
        assert result.name == "田中太郎"
        assert result.email == "tanaka@example.com"
        user_repo.save.assert_called_once()
        email_service.send_welcome_email.assert_called_once()

    def test_create_user_invalid_email(self):
        """異常系: 無効なメールアドレス"""
        service = UserService(Mock(), Mock())

        with pytest.raises(ValueError, match="無効なメールアドレス"):
            service.create_user("田中太郎", "invalid-email")
```

**教育的説明:**
```
🧪 テスト駆動開発 (TDD) の実践

【学習ポイント】
1. **AAA パターン**
   - Arrange: テストデータの準備
   - Act: テスト対象の実行
   - Assert: 結果の検証

2. **テストの命名規則**
   - test_[機能]_[条件]_[期待結果]
   - 日本語コメントで詳細説明

3. **Mock の活用**
   - 外部依存を排除したユニットテスト
   - 呼び出し回数・引数の検証

4. **正常系・異常系のテスト**
   - ハッピーパス（正常系）
   - エラーハンドリング（異常系）

【テストのメリット】
- リファクタリング時の安全性
- 仕様の文書化
- バグの早期発見

【参考資料】
- pytest: https://docs.pytest.org/
- unittest.mock: https://docs.python.org/ja/3/library/unittest.mock.html
```

