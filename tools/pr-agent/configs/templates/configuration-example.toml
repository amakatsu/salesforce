# =============================================================================
# PR-Agent 設定ファイル例（詳細コメント付き）
# =============================================================================
# このファイルをコピーして .pr_agent.toml として使用してください
# 設定の優先順位: CLI引数 > リポジトリ設定 > ユーザー設定 > デフォルト設定

# =============================================================================
# 基本設定 [config]
# =============================================================================
[config]

# -----------------------------------------------------------------------------
# AIモデル設定
# -----------------------------------------------------------------------------
model = "gpt-4o-mini"                      # メインで使用するAIモデル
fallback_models = ["gpt-4", "gpt-3.5-turbo"]  # メインモデル失敗時のフォールバック
model_reasoning = "o1-preview"              # 推論専用モデル（高度な分析用）
model_weak = "gpt-3.5-turbo"               # 軽量タスク用モデル（ラベル生成等）

# -----------------------------------------------------------------------------
# 出力・言語設定
# -----------------------------------------------------------------------------
response_language = "ja-JP"                 # 応答言語（日本語）
                                           # 対応: "en-US", "ja-JP", "zh-CN", "es-ES" など
git_provider = "github"                    # Gitプラットフォーム
                                           # 選択肢: "github", "gitlab", "bitbucket", "azure"
publish_output = true                      # 結果をPRにコメント投稿するか
publish_output_progress = true             # 進行状況を表示するか
verbosity_level = 1                        # ログ詳細度 (0=最小, 1=通常, 2=詳細)

# -----------------------------------------------------------------------------
# AI応答制御
# -----------------------------------------------------------------------------
temperature = 0.2                          # AI応答の創造性 (0.0-1.0)
                                           # 0.0=保守的, 1.0=創造的
seed = -1                                  # 応答の再現性制御 (-1=無効, 正数=固定シード)
ai_timeout = 120                           # AI応答タイムアウト（秒）
reasoning_effort = "medium"                # 推論努力レベル ("low", "medium", "high")

# -----------------------------------------------------------------------------
# トークン制限設定
# -----------------------------------------------------------------------------
max_model_tokens = 32000                   # モデル最大トークン数
max_description_tokens = 500               # PR説明生成の最大トークン
max_commits_tokens = 500                   # コミット情報の最大トークン
custom_model_max_tokens = -1               # カスタムモデル用トークン制限

# -----------------------------------------------------------------------------
# パッチ処理設定
# -----------------------------------------------------------------------------
patch_extension_skip_types = [             # 分析をスキップするファイル拡張子
    ".md", ".txt", ".json", ".yml", ".yaml",
    ".png", ".jpg", ".gif", ".svg",
    ".lock", ".log"
]
patch_extra_lines_before = 5               # パッチ前の追加行数
patch_extra_lines_after = 1                # パッチ後の追加行数
allow_dynamic_context = true               # 動的コンテキスト拡張を許可
max_extra_lines_before_dynamic_context = 10  # 動的コンテキストの最大行数
large_patch_policy = "clip"                # 大きなパッチの処理方法 ("clip", "skip")

# -----------------------------------------------------------------------------
# 無視設定（正規表現対応）
# -----------------------------------------------------------------------------
ignore_pr_title = [                        # 無視するPRタイトルパターン
    "^\\[Auto\\]",                         # [Auto] で始まる
    "^WIP:",                               # WIP: で始まる
    "^Draft:",                             # Draft: で始まる
    "^Revert"                              # Revert で始まる
]
ignore_pr_target_branches = [              # 無視する対象ブランチ
    "main",                                # メインブランチ
    "master",                              # マスターブランチ
    "develop",                             # 開発ブランチ
    "staging"                              # ステージングブランチ
]
ignore_pr_source_branches = [              # 無視するソースブランチ
    "dependabot/.*",                       # Dependabot自動更新
    "renovate/.*",                         # Renovate自動更新
    "hotfix/.*"                            # ホットフィックス
]
ignore_pr_labels = [                       # 無視するラベル
    "no-review",                           # レビュー不要
    "skip-ai",                             # AI処理スキップ
    "dependencies",                        # 依存関係更新
    "auto-update"                          # 自動更新
]
ignore_pr_authors = [                      # 無視する作成者
    "dependabot[bot]",                     # Dependabot
    "renovate[bot]",                       # Renovate
    "github-actions[bot]"                  # GitHub Actions
]
ignore_repositories = [                    # 無視するリポジトリパターン
    "org/internal-.*",                     # 内部ツール
    ".*/test-.*"                           # テストリポジトリ
]

# -----------------------------------------------------------------------------
# セキュリティ・秘匿設定
# -----------------------------------------------------------------------------
secret_provider = ""                       # 秘匿情報管理
                                           # 選択肢: "", "google_cloud_storage", "aws_secrets_manager"
ai_disclaimer_title = "AI生成コンテンツについて"  # AI免責事項タイトル
ai_disclaimer = "この内容はAIによって生成されました。最終確認は人間が行ってください。"

# -----------------------------------------------------------------------------
# 自動承認設定（Pro機能）
# -----------------------------------------------------------------------------
enable_auto_approval = false               # 自動承認機能を有効にするか
auto_approve_for_low_review_effort = -1    # 低労力PR自動承認閾値 (-1=無効, 1-5)
auto_approve_for_no_suggestions = false    # 提案なしPRの自動承認
ensure_ticket_compliance = false          # チケット準拠チェック

# =============================================================================
# PRレビュー設定 [pr_reviewer]
# =============================================================================
[pr_reviewer]

# -----------------------------------------------------------------------------
# レビュー要素の有効/無効
# -----------------------------------------------------------------------------
require_score_review = true                # レビュースコア評価を要求
require_tests_review = true                # テストレビューを要求
require_estimate_effort_to_review = true   # レビュー工数見積もりを要求
require_can_be_split_review = false        # PR分割可能性評価を要求
require_focused_review = false             # 集中レビューモード

# -----------------------------------------------------------------------------
# レビュー内容カスタマイズ
# -----------------------------------------------------------------------------
extra_instructions = """
このプロジェクトでは以下の観点を重視してレビューしてください：

🔒 セキュリティ
- OWASP Top 10 準拠
- 入力値検証
- 認証・認可の実装
- 機密情報の適切な取り扱い

⚡ パフォーマンス
- データベースクエリ最適化
- メモリ使用量
- 処理速度

🧪 テスト
- ユニットテストカバレッジ
- エッジケーステスト
- 統合テスト

📚 保守性
- コードの可読性
- ドキュメント更新
- 命名規則の統一
"""

# -----------------------------------------------------------------------------
# コード提案設定
# -----------------------------------------------------------------------------
num_code_suggestions = 4                   # 生成するコード提案数 (0-10)
persistent_comment = true                  # 永続的なコメント投稿
enable_help_text = true                    # ヘルプテキストを表示
enable_review_labels_effort = true         # レビュー工数ラベル
enable_review_labels_security = true       # セキュリティラベル

# -----------------------------------------------------------------------------
# 出力形式
# -----------------------------------------------------------------------------
inline_file_summary = false               # ファイル内サマリー表示
collapsible_file_list = "adaptive"        # ファイルリスト折りたたみ ("true", "false", "adaptive")
collapsible_file_list_threshold = 6       # 折りたたみ開始ファイル数

# =============================================================================
# PR説明生成設定 [pr_description]
# =============================================================================
[pr_description]

# -----------------------------------------------------------------------------
# 説明生成機能
# -----------------------------------------------------------------------------
generate_ai_title = true                   # AIによるタイトル生成
use_bullet_points = true                   # 箇条書き形式使用
enable_pr_type = true                      # PR種別（機能追加、バグ修正等）表示
add_original_user_description = true       # 元のユーザー説明を保持
enable_semantic_files_types = true         # ファイル種別の意味解析

# -----------------------------------------------------------------------------
# 内容カスタマイズ
# -----------------------------------------------------------------------------
extra_instructions = """
PR説明では以下の情報を含めてください：

📋 変更概要
- 何を変更したか
- なぜ変更したか
- どのように実装したか

🎯 影響範囲
- 影響を受ける機能
- 既存機能への影響
- パフォーマンスへの影響

✅ テスト
- 実施したテスト
- テストカバレッジ
- 確認すべき項目

⚠️ 注意事項
- 破壊的変更
- 設定変更の必要性
- デプロイ時の注意点
"""

# -----------------------------------------------------------------------------
# ラベル・出力設定
# -----------------------------------------------------------------------------
publish_labels = true                      # ラベル自動生成・付与
publish_description_as_comment = false     # 説明をコメントとして投稿
enable_pr_diagram = false                 # PR変更図の表示
final_update_message = true               # 最終更新メッセージ

# =============================================================================
# コード改善提案設定 [pr_code_suggestions]
# =============================================================================
[pr_code_suggestions]

# -----------------------------------------------------------------------------
# 提案生成設定
# -----------------------------------------------------------------------------
max_context_tokens = 24000                 # コンテキスト最大トークン数
commitable_code_suggestions = true         # コミット可能な提案生成
focus_only_on_problems = false             # 問題のみに焦点 (false=改善提案も含む)
suggestions_score_threshold = 7            # 提案採用スコア閾値 (0-10)

# -----------------------------------------------------------------------------
# 提案内容カスタマイズ
# -----------------------------------------------------------------------------
extra_instructions = """
コード改善提案では以下の観点を重視してください：

🚀 パフォーマンス改善
- アルゴリズム最適化
- データ構造の見直し
- 不要な処理の除去

🔧 保守性向上
- コードの簡素化
- 関数分割
- 命名の改善

🛡️ セキュリティ強化
- 入力検証の追加
- エラーハンドリング改善
- ログ出力の適正化

📋 ベストプラクティス
- 言語固有の慣習
- デザインパターン適用
- 可読性向上
"""

# -----------------------------------------------------------------------------
# 出力・適用設定
# -----------------------------------------------------------------------------
apply_suggestions_checkbox = true          # 提案適用チェックボックス表示
dual_publishing_score_threshold = 8        # 二重公開スコア閾値
persistent_comment = true                  # 永続的コメント
max_history_len = 4                        # 履歴保持数

# =============================================================================
# 質問機能設定 [pr_questions]
# =============================================================================
[pr_questions]
enable_help_text = false                   # ヘルプテキスト表示
use_conversation_history = true            # 会話履歴使用

# =============================================================================
# Gitプロバイダー固有設定
# =============================================================================

# GitHub設定
[github]
deployment_type = "user"                   # デプロイメント種別 ("app", "user")
base_url = "https://api.github.com"        # GitHub API URL
ratelimit_retries = 5                      # レート制限時のリトライ回数
app_name = "pr-agent"                      # アプリ名
ignore_bot_pr = true                       # Bot PRを無視
publish_inline_comments_fallback_with_verification = true  # インラインコメント代替

# GitLab設定
[gitlab]
url = "https://gitlab.com"                 # GitLab インスタンスURL
ratelimit_retries = 5                      # レート制限時のリトライ回数

# =============================================================================
# 高度な設定・実験的機能
# =============================================================================

# Claude拡張思考設定（Claude推論モデル用）
[config]
enable_claude_extended_thinking = false    # Claude拡張思考機能
extended_thinking_budget_tokens = 2048     # 拡張思考トークン予算
extended_thinking_max_output_tokens = 4096 # 拡張思考最大出力

# AIメタデータ設定
enable_ai_metadata = false                 # AIメタデータ追加

# =============================================================================
# カスタムセクション例
# =============================================================================

# カスタムAIハンドラー設定例
[custom_ai]
api_key = "your-custom-api-key"            # カスタムAI APIキー
endpoint = "https://api.custom-ai.com/v1"  # カスタムAI エンドポイント
model = "custom-model-name"                # カスタムモデル名
timeout = 120                              # タイムアウト（秒）

# プロジェクト固有設定例
[project_specific]
language = "python"                        # 主要言語
framework = "django"                       # 使用フレームワーク
coding_style = "pep8"                      # コーディングスタイル
test_framework = "pytest"                  # テストフレームワーク

# チーム設定例
[team]
review_team = ["senior-dev1", "senior-dev2"]  # レビュー担当者
notification_channel = "#dev-reviews"      # 通知チャンネル
timezone = "Asia/Tokyo"                    # タイムゾーン

# =============================================================================
# 設定のテンプレート集
# =============================================================================

# 以下のセクションはコメントアウトされています。
# 必要に応じてコメントを外して使用してください。

