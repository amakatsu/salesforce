# 共通設定 - すべてのPR-Agentレビューで使用される基本設定
# ※ 具体的なチェック項目は選択tomlから注入される

[config]
model = "PBkBKGPT0SpkSub001OAI001MDL015"
model_turbo = "PBkBKGPT0SpkSub001OAI001MDL015"
fallback_models = ["PBkBKGPT0SpkSub001OAI001MDL015"]
# API上限があるため据え置き
temperature = 1.0
language = "ja"
response_language = "ja-JP"
verbosity_level = 2
max_model_tokens = 128000
custom_model_max_tokens = 128000
reasoning_effort = "low"
git_provider = "gitlab"
verbosity = "low"
enable_custom_labels = false
max_description_tokens = 128000
max_commits_tokens = 128000
patch_extra_lines_before = 5
patch_extra_lines_after = 5
large_patch_policy = "clip"
allow_dynamic_context = true
enable_ai_metadata = true
use_extra_bad_extensions = true
enable_help_text = true

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
num_code_suggestions = 10
enable_review_labels_effort = true
enable_review_labels_security = true
extra_instructions = """
- 差分が不完全な場合はPRタイトル・説明から推測してレビュー
- 差分が大きすぎる場合は可能な範囲でフィードバック
- ファイル一覧が取得できている場合は変更ファイル名を記載
"""

[pr_description]
publish_description = true
add_original_user_description = true
enable_pr_type = true
use_bullet_points = true
enable_semantic_files_types = true
collapsible_file_list = "adaptive"
generate_ai_title = false
extra_instructions = """
- 変更の「Why」を重視
- ビジネスインパクトを明確に
- 破壊的変更は明示
"""

[pr_code_suggestions]
max_context_tokens = 128000
num_code_suggestions = 10
commitable_code_suggestions = true
enable_help_text = true
extra_instructions = """
- Critical > Important > Nice to have の優先順位
- before/afterコード例を含める
- すぐ適用可能な形式で提案
"""

[pr_questions]
enable_help_text = true
extra_instructions = """
- 具体的で実用的な回答
- コード例を含める
"""

[pr_improve]
num_code_suggestions = 10
enable_help_text = true
extra_instructions = """
- パフォーマンス、エッジケース、エラーハンドリングに注目
- 具体的なコード例を含める
"""

[pr_add_docs]
enable_help_text = true
docs_style = "Google Style"
extra_instructions = """
- 目的、パラメータ、戻り値、使用例を含める
"""

[pr_update_changelog]
enable_help_text = true
extra_instructions = """
- Added/Changed/Fixed/Security等のカテゴリ分類
- セマンティックバージョニング観点で影響度明記
"""

[pr_generate_labels]
enable_help_text = true

[pr_similar_issue]
enable_help_text = true

[ignore]
glob = ['*.md']

[gitlab]
url = "https://gitlab.rp.dss.itmufg"
