[pr_reviewer]
extra_instructions = "必ず日本語でレビューしてください。\n\n**Java固有の観点でレビューしてください：**\n\n1. **設計パターン**\n   - 適切なデザインパターンの使用（Singleton, Factory, Builder等）\n   - SOLID原則の遵守\n   - 依存性注入（DI）の適切な使用\n\n2. **Javaベストプラクティス**\n   - Optional の適切な使用\n   - Stream API の効率的な利用\n   - try-with-resources の使用\n   - equals() と hashCode() の実装\n   - toString() の実装\n\n3. **パフォーマンス**\n   - 不要なオブジェクト生成の回避\n   - StringBuilder vs String 連結\n   - コレクションの適切な選択（ArrayList vs LinkedList等）\n   - ストリーム処理の最適化\n\n4. **並行処理**\n   - スレッドセーフティの確保\n   - synchronized の適切な使用\n   - Concurrent コレクションの活用\n   - volatile, AtomicXxx の使用\n\n5. **例外処理**\n   - チェック例外 vs 非チェック例外\n   - カスタム例外の設計\n   - リソースリーク防止\n\n6. **命名規則**\n   - クラス名: PascalCase\n   - メソッド名: camelCase\n   - 定数: UPPER_SNAKE_CASE\n   - パッケージ名: 小文字\n\n7. **JavaDoc**\n   - public メソッドへの適切なドキュメント\n   - @param, @return, @throws の記述\n"
num_code_suggestions = 10
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
enable_review_labels_effort = true
enable_review_labels_security = true

