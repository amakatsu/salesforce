[pr_add_docs]
extra_instructions = """
必ず日本語でApexDocを生成してください。

ApexDoc/JSDocには以下を含めてください：
- クラス/コンポーネントの目的と責務
- @description: 詳細な説明
- @param: パラメータの説明（型、制約）
