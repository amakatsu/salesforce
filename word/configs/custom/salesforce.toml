[pr_reviewer]
extra_instructions = "必ず日本語でレビューしてください。\n\n**Salesforce固有の観点でレビューしてください：**\n\n1. **ガバナ制限（Governor Limits）**\n   - SOQL クエリ数（100回制限）\n   - DML 操作数（150回制限）\n   - ヒープサイズ（6MB制限）\n   - CPU時間（10秒制限）\n   - ループ内での SOQL/DML の回避\n\n2. **Apex ベストプラクティス**\n   - バルク処理対応（Trigger Handler パターン）\n   - Selector パターンの使用\n   - トリガーロジックのクラス分離\n   - テストクラスのカバレッジ（75%以上）\n   - @TestSetup の活用\n\n3. **SOQL 最適化**\n   - SELECT 句の必要最小限のフィールド選択\n   - WHERE 句のインデックス活用\n   - クエリセレクタの使用\n   - 子レコードの取得（サブクエリ）\n\n4. **セキュリティ**\n   - with sharing / without sharing の適切な使用\n   - CRUD/FLS チェック\n   - SOQL インジェクション対策（String.escapeSingleQuotes）\n   - XSS 対策（ESAPI の使用）\n\n5. **Lightning Web Components (LWC)**\n   - @api, @track, @wire の適切な使用\n   - イベント駆動設計\n   - コンポーネント間通信\n   - エラーハンドリング\n\n6. **Visualforce**\n   - ViewState サイズの最小化\n   - Remote Action の活用\n   - JavaScript Remoting\n\n7. **非同期処理**\n   - @future メソッドの使用\n   - Queueable Apex\n   - Batch Apex\n   - Scheduled Apex\n"
num_code_suggestions = 10
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
enable_review_labels_effort = true
enable_review_labels_security = true

