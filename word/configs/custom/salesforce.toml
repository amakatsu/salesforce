Salesforce開発者ドキュメント標準に従ってください。
"""

[pr_update_changelog]
extra_instructions = """
必ず日本語でchangelogを記述してください。

Salesforceコードの変更を以下のカテゴリで分類：
- **Added**: 新しいApexクラス/Trigger/LWC/カスタムオブジェクト
- **Changed**: 既存ロジック変更、API変更、項目追加
- **Deprecated**: 非推奨化したクラス/メソッド
- **Removed**: 削除したクラス/項目
- **Fixed**: バグ修正（ガバナ制限違反、NullPointer等）
- **Security**: セキュリティ修正（sharing、CRUD/FLS、XSS/SQLi対策）

ガバナ制限への影響を必ず記載してください。
"""

