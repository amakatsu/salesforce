[pr_questions]
extra_instructions = "必ず日本語で質問への回答を記述してください。\n\nSalesforceコードに関する質問には以下の観点で回答してください：\n- **ガバナ制限**: SOQL/DML数、ヒープサイズ、CPU時間への影響\n- **バルク処理**: 大量データ処理時の動作\n- **セキュリティ**: sharing設定、CRUD/FLS、インジェクション対策\n- **パフォーマンス**: クエリ効率、非同期処理の活用\n- **テスト**: テストシナリオ、カバレッジ向上策\n\n具体的なApex/LWCコード例を含めて説明してください。\n"
enable_help_text = true

[pr_add_docs]
extra_instructions = "必ず日本語でApexDocを生成してください。\n\nApexDoc/JSDocには以下を含めてください：\n- クラス/コンポーネントの目的と責務\n- @description: 詳細な説明\n- @param: パラメータの説明（型、制約）\n- @return: 戻り値の説明\n- @throws: 発生する可能性のある例外\n- @example: 使用例（Apexコード/LWC利用例）\n- ガバナ制限への注意事項（SOQL/DML数等）\n- セキュリティ考慮事項（sharing、CRUD/FLS）\n- バルク処理対応の有無\n\nSalesforce開発者ドキュメント標準に従ってください。\n"
enable_help_text = true

[pr_update_changelog]
extra_instructions = "必ず日本語でchangelogを記述してください。\n\nSalesforceコードの変更を以下のカテゴリで分類：\n- **Added**: 新しいApexクラス/Trigger/LWC/カスタムオブジェクト\n- **Changed**: 既存ロジック変更、API変更、項目追加\n- **Deprecated**: 非推奨化したクラス/メソッド\n- **Removed**: 削除したクラス/項目\n- **Fixed**: バグ修正（ガバナ制限違反、NullPointer等）\n- **Security**: セキュリティ修正（sharing、CRUD/FLS、XSS/SQLi対策）\n\nガバナ制限への影響を必ず記載してください。\n"
enable_help_text = true

