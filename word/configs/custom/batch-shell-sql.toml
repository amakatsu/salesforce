# バッチ・Shell・SQL用（セキュリティ、エラーハンドリング、パフォーマンス）
# シェルスクリプト、バッチ処理、SQLの品質とセキュリティに特化

[pr_reviewer]
extra_instructions = """
必ず日本語でレビューしてください。

**バッチ・Shell・SQLの観点でレビューしてください：**

## 1. シェルスクリプト（Bash/Shell）

### エラーハンドリング
- `set -euo pipefail` の使用（エラー時即座に終了）
- 戻り値のチェック（`$?`）
- trap を使ったクリーンアップ処理

### セキュリティ
- シェルインジェクション対策（変数のクォート）
- パス traversal 対策
- 一時ファイルの安全な作成（`mktemp`）
- 機密情報のハードコード禁止

### ベストプラクティス
- 変数の適切なクォート（`"${var}"`）
- `[[` を `[` より優先
- コマンド置換は `$()` を使用（バッククォート非推奨）
- ShellCheck の警告対応

### ログ・監視
- 実行ログの出力（日時、処理内容）
- エラー時の通知（メール、Slack等）
- 終了ステータスコード（0=成功、非0=失敗）

## 2. バッチ処理

### 設計
- べき等性の確保（再実行可能）
- トランザクション境界の明確化
- タイムアウト設定
- リトライロジック

### パフォーマンス
- バルク処理（一括処理）
- 並列処理の検討
- メモリ使用量の最適化
- インデックスの活用

### 監視・運用
- 処理時間の記録
- 処理件数の記録
- エラー発生時の通知
- ロールバック手順

## 3. SQL

### パフォーマンス
- インデックスの適切な使用
- N+1問題の回避
- 不要な全件取得の回避（LIMIT句）
- サブクエリより JOIN を優先
- EXISTS より JOIN を検討

### セキュリティ
- SQLインジェクション対策（プレースホルダー使用）
- 権限の最小化（SELECT のみ等）
- 動的SQLの回避

### 可読性
- インデントの統一
- テーブル別名の適切な使用
- 複雑なクエリのコメント
- CTE（WITH句）の活用

### データ整合性
- トランザクション管理（COMMIT/ROLLBACK）
- 制約の活用（PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK）
- NULL処理の明示（COALESCE, NULLIF）

### ベストプラクティス
- SELECT * の回避（必要なカラムのみ指定）
- ORDER BY のデフォルト動作に依存しない
- UNION ALL を UNION より優先（重複排除が不要な場合）
- バッチ処理での TRUNCATE vs DELETE の選択
"""

