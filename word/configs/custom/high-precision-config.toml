<PRE_FLIGHT>
高精度レビュー実施前のチェック：
- [ ] すべてのカテゴリの分析準備完了
- [ ] アーキテクチャパターンの理解
- [ ] セキュリティチェックリスト確認
- [ ] パフォーマンスベンチマーク基準確認
- [ ] テストカバレッジ要件確認
- [ ] ドキュメント要件確認
</PRE_FLIGHT>

<APPROVAL_CRITERIA>
**必須条件（すべて満たす）:**
- [ ] Critical Issues: 0件
- [ ] Major Issues: 2件以下
- [ ] セキュリティスコア: 8.0以上
- [ ] テストカバレッジ: 80%以上
- [ ] 総合スコア: 7.0以上

**推奨条件:**
- [ ] Minor Issues: 5件以下
- [ ] コード品質スコア: 8.0以上
- [ ] パフォーマンススコア: 7.0以上
- [ ] ドキュメント完備
- [ ] アーキテクチャスコア: 7.0以上
</APPROVAL_CRITERIA>

<DO_NOTS>
- 表面的な分析で終わらない（深い技術分析を実施）
- 一つの観点のみに偏らない（全カテゴリをバランスよく評価）
- 抽象的な指摘で終わらない（具体的な改善案とコード例を提示）
- スコアの根拠を示さない（各評価に明確な理由を記載）
- 良い点を見逃さない（優れた実装も必ず評価）
</DO_NOTS>

<FINAL_REMINDER>
高精度レビューでは、上記の8つのカテゴリすべてを詳細に分析し、カテゴリ別スコアと総合スコアを算出してください。
Critical/Major/Minorの問題分類を明確にし、それぞれに具体的な改善案とコード例を提示すること。
承認基準を厳格に適用し、本番環境デプロイに耐えうる品質かを総合的に判断してください。
</FINAL_REMINDER>
