# ✅ Pythonicで優れたコード例

**基本的なPythonicコード:**
```python
# リスト内包表記とジェネレータ
result = [i * 2 for i in range(1000) if i % 2 == 0]  # リスト
result_gen = (i * 2 for i in range(1000000) if i % 2 == 0)  # メモリ効率良

# for-inループ
for item in items:
    process(item)

# 真偽値判定
if items:  # len(items) > 0 ではなく
    process(items)
```

**型ヒントとdocstring:**
```python
from typing import List, Optional

def calculate_total(items: List[float], discount: float = 0.0) -> float:
    """合計金額を計算

    Args:
        items: 商品価格のリスト
        discount: 割引率（0.0-1.0）、デフォルト0.0

    Returns:
        割引後の合計金額

    Raises:
        ValueError: discountが範囲外の場合

    Examples:
        >>> calculate_total([100, 200], 0.1)
        270.0
    """
    if not 0 <= discount <= 1:
        raise ValueError("割引率は0.0-1.0の範囲である必要があります")
    return sum(items) * (1 - discount)
```

**コンテキストマネージャー:**
```python
# with文でリソース保証
with open('data.txt', 'r') as file:
    data = file.read()

# カスタムコンテキストマネージャー
from contextlib import contextmanager

@contextmanager
def database_transaction(db):
    try:
        yield db
        db.commit()
    except Exception:
        db.rollback()
        raise
```

**EAFP（例外処理）:**
```python
# Pythonic な例外処理
try:
    value = dictionary[key]
except KeyError:
    value = default_value
```

**デコレータとキャッシュ:**
```python
from functools import lru_cache, wraps
import time

@lru_cache(maxsize=128)
def fibonacci(n: int) -> int:
    if n < 2:
        return n
    return fibonacci(n-1) + fibonacci(n-2)

def log_execution_time(func):
    @wraps(func)
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        print(f"{func.__name__}: {time.time() - start:.2f}秒")
        return result
    return wrapper
```

**データクラス:**
```python
from dataclasses import dataclass, field
from typing import List

@dataclass
class User:
    name: str
    email: str
    age: int
    tags: List[str] = field(default_factory=list)

    def __post_init__(self):
        if self.age < 0:
            raise ValueError("年齢は0以上である必要があります")
```

**非同期処理:**
```python
import asyncio
import aiohttp

async def fetch_one(session: aiohttp.ClientSession, url: str) -> dict:
    async with session.get(url) as response:
        return await response.json()

async def fetch_all(urls: List[str]) -> List[dict]:
    async with aiohttp.ClientSession() as session:
        tasks = [fetch_one(session, url) for url in urls]
        return await asyncio.gather(*tasks)
```
