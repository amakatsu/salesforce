# ❌ Non-Pythonicで問題のあるコード例

**問題1: Non-Pythonicなループ:**
```python
# ❌ 悪い例
i = 0
while i < len(items):
    print(items[i])
    i += 1

# ✅ 改善後
for item in items:
    print(item)

# 💭 改善理由:
# - Pythonicなfor-inループを使用
# - インデックス管理が不要
# - 可読性が向上
```

**問題2: 型ヒントとdocstringの欠如:**
```python
# ❌ 悪い例
def calc(x, y):
    return x * y

# ✅ 改善後
def calculate_product(x: float, y: float) -> float:
    """2つの数値の積を計算

    Args:
        x: 1つ目の数値
        y: 2つ目の数値

    Returns:
        x と y の積
    """
    return x * y

# 💭 改善理由:
# - 型ヒントで入出力が明確
# - docstringで関数の目的を説明
# - IDEの補完とmypyの型チェックが可能
```

**問題3: ミュータブルなデフォルト引数:**
```python
# ❌ 悪い例（バグ）
def add_item(item, items=[]):
    items.append(item)
    return items

# ✅ 改善後
def add_item(item, items: Optional[List] = None) -> List:
    """アイテムをリストに追加

    Args:
        item: 追加するアイテム
        items: 追加先リスト（Noneの場合は新規作成）

    Returns:
        アイテムが追加されたリスト
    """
    if items is None:
        items = []
    items.append(item)
    return items

# 💭 改善理由:
# - ミュータブルなデフォルト引数の問題を回避
# - 各呼び出しで新しいリストが作成される
# - 予期しない動作を防止
```

**問題4: リソースリーク:**
```python
# ❌ 悪い例
file = open('data.txt', 'r')
data = file.read()
file.close()  # 例外時に実行されない

# ✅ 改善後
with open('data.txt', 'r') as file:
    data = file.read()

# 💭 改善理由:
# - with文で自動的にcloseされる
# - 例外発生時もリソース解放が保証される
# - Pythonicなリソース管理
```

**問題5: パフォーマンス問題:**
```python
# ❌ 悪い例（遅い）
items_list = list(range(10000))
if 9999 in items_list:  # O(n)
    pass

# ✅ 改善後
items_set = set(range(10000))
if 9999 in items_set:  # O(1)
    pass

# 💭 改善理由:
# - setのメンバーシップテストはO(1)
# - listのメンバーシップテストはO(n)
# - 大量データでは劇的な速度差
```

**問題6: 非効率な文字列連結:**
```python
# ❌ 悪い例（遅い）
result = ""
for s in strings:
    result += s  # 毎回新しい文字列オブジェクト作成

# ✅ 改善後
result = "".join(strings)

# 💭 改善理由:
# - joinは一度だけメモリ割り当て
# - +=は毎回新しいオブジェクト作成（O(n²)）
# - joinはO(n)で圧倒的に高速
```
