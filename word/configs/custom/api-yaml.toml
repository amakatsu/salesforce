# API YAML用（OpenAPI、Kubernetes、Docker Compose、CI/CD）
# OpenAPI/Swagger、Kubernetes、Docker Compose等のYAML設定ファイルのレビューに特化

[pr_reviewer]
extra_instructions = """
必ず日本語でレビューしてください。

## OpenAPI（YAML）チェック観点

### 1. フォルダ・ファイル命名
- プロジェクト直下フォルダ: `{画面ID}_{画面英語名}` または `{機能ID}_{機能英語名}`
- API ファイル名: エンドポイントの `/` を `_` に置換
- API 概要 MD: API ファイルと同名（`description/`配下）
- スキーマファイル名:
  - requestBody: `{画面ID|機能ID}_{APIイベント英語名}_request.yaml`
  - response: `{画面ID|機能ID}_{APIイベント英語名}_response.yaml`
  - shared: `{スキーマ名}.yaml`

### 2. ルートファイル（openapi.yaml）
- `openapi: 3.1.0`
- `tags`
  - `name`: `{画面ID}_{画面英語名}` or `{機能ID}_{機能英語名}`（パスカルケース）
  - `x-displayName`: `{日本語名}({ID})`
- `paths`
  - `summary`: `{APIイベント日本語名}`
  - `$ref`: API ファイルへの相対パス

### 3. API ファイル
- 必須項目: `summary`, `tags`, `operationId`, `description`
- `tags`: 1 URI = 1 tag、ルート `tags.name` と一致
- `operationId`: `{画面ID|機能ID}_{APIイベント英語名}`（camelCase）、パスパラメータ名は含めない
- `description`: API 処理概要（MD）への `$ref` を指定
- `parameters`:
  - 共通ヘッダーは定義しない（API 固有のみ）
  - `name`, `description`, `schema`, `example` 必須
  - `name`: 英語名 camelCase / `description`: 日本語名
  - 使用可能: `in: query` のみ、配列は `explode: true`、object 型は不可
  - POST/PUT では `parameters` 利用禁止
- `requestBody`:
  - GET/DELETE では禁止
  - `required: true` 必須
  - MediaType は `application/json` のみ
  - `schema` はスキーマファイルへの `$ref`（相対パス）
- `responses`:
  - `description` 必須、共通レスポンスヘッダーは定義しない
  - 正常系は 200 または 204 のみ、レスポンスコードは文字列で定義（例: `"200"`）
  - 200: `content` 必須 / 204: `content` 禁止
  - `default` 必須: `default: { $ref: ../../../errors/UnexpectedError.yaml }`
  - MediaType は `application/json` のみ

### 4. スキーマファイル
- `title` 必須、ファイル名と一致
- `description` 必須、日本語でデータ名を記述
- `type: object` 固定
- `properties`: 各項目名は camelCase、`type`, `description`, `example` 必須
- ネスト object は別スキーマに分離して `$ref`

### 5. 過去不具合ルール（重要）
- 桁数バリデーションは `digit` で行う（`max=999` のような桁表現は不可）
- `description` と `itemName` はダブルクォートで括る
- 文字列型: `required` + `@NotBlank`
- その他型: `required` + `@NotNull`
"""

[pr_code_suggestions]
extra_instructions = """
必ず日本語でコード提案を記述してください。

## OpenAPI コード提案の観点

### 命名規則
- operationId: `{画面ID|機能ID}_{APIイベント英語名}`（camelCase）
- パラメータ名: 英語名 camelCase
- スキーマプロパティ名: camelCase

### requestBody/response
- requestBody ファイル名: `{画面ID|機能ID}_{APIイベント英語名}_request.yaml`
- response ファイル名: `{画面ID|機能ID}_{APIイベント英語名}_response.yaml`
- MediaType は `application/json` のみ

### スキーマ定義
- `title` はファイル名と一致させる
- `description` は日本語でデータ名を記述
- 各プロパティには `type`, `description`, `example` を必須で記載
- ネスト object は別スキーマに分離して `$ref` で参照

### バリデーション
- 桁数バリデーションは `digit` で行う（`max=999` は不可）
- 禀議番号等のバリデーション例:
```yaml
rsNo:
  description: "禀査番号"
  type: string
  example: "1234"
  x-custom-validation:
    - Pattern:
        itemName: "禀査番号"
        regexp: "[0-9]{4}"
```
- `description` と `itemName` はダブルクォートで括る
- 文字列型: `required` + `@NotBlank`
- その他型: `required` + `@NotNull`

### responses
- 正常系は 200 または 204 のみ
- レスポンスコードは文字列で定義（例: `"200"`）
- 200: `content` 必須 / 204: `content` 禁止
- `default` は必須: `{ $ref: ../../../errors/UnexpectedError.yaml }`
"""

[pr_description]
extra_instructions = """
必ず日本語でMR説明を記述してください。

API YAMLの変更内容を以下の観点で説明してください：
- 変更したYAMLファイルとその目的（OpenAPI、K8s、Docker Compose等）
- APIエンドポイントの変更内容
- セキュリティへの配慮（認証、認可、Secret管理等）
- インフラへの影響（リソース、ネットワーク、依存関係等）
"""

[pr_questions]
extra_instructions = """
必ず日本語で質問への回答を記述してください。

API YAMLに関する質問には以下の観点で回答してください：
- **OpenAPI**: APIエンドポイント、スキーマ定義、バリデーションルール
- **Kubernetes**: リソース要求/制限、スケーリング設定、ヘルスチェック
- **セキュリティ**: 認証・認可方式、Secret管理、ネットワークポリシー
- **互換性**: 既存APIへの影響、破壊的変更の有無
- **パフォーマンス**: レスポンスタイム、リソース使用量

具体的なYAML設定例を含めて説明してください。
"""

[pr_add_docs]
extra_instructions = """
必ず日本語でドキュメントを生成してください。

API YAMLドキュメントには以下を含めてください：
- **概要**: ファイルの目的と役割
- **OpenAPI仕様の場合**:
  - エンドポイント一覧
  - リクエスト/レスポンススキーマ
  - 認証方式
  - エラーレスポンス
- **Kubernetes仕様の場合**:
  - リソース種別と役割
  - 環境変数の説明
  - ボリュームマウント
  - ネットワーク設定
- **使用例**: curlコマンド、kubectl apply例
- **注意事項**: セキュリティ、パフォーマンス、制約事項

YAML内にコメントで説明を記載してください。
"""

[pr_update_changelog]
extra_instructions = """
必ず日本語でchangelogを記述してください。

API YAMLの変更を以下のカテゴリで分類：
- **Added**: 新しいエンドポイント/リソース、新機能
- **Changed**: エンドポイント変更、スキーマ変更、設定変更
- **Deprecated**: 非推奨化したエンドポイント/設定
- **Removed**: 削除したエンドポイント/リソース
- **Fixed**: バグ修正（バリデーション、設定ミス等）
- **Security**: セキュリティ修正（認証強化、権限設定等）

API互換性への影響（破壊的変更）を必ず明記してください。
"""

[pr_generate_labels]
extra_instructions = """
API YAMLの変更内容を分析して適切なラベルを提案してください：

- **変更の種類**: feature, bugfix, refactor, security
- **影響範囲**: api-breaking-change, backward-compatible, openapi, kubernetes
- **API関連**: new-endpoint, schema-change, auth-change
- **インフラ**: resource-change, network-change, scaling-change
- **優先度**: critical, high, medium, low
- **レビュー**: needs-api-review, needs-security-review, needs-sre-review
"""

[pr_similar_issue]
extra_instructions = """
必ず日本語で類似Issueの分析を記述してください。

API YAMLの変更と類似Issueの関連性を以下の観点で分析：
- 同じAPIエンドポイントへの変更
- 類似のKubernetesリソース設定
- 同様のセキュリティ対策
- 類似のスキーマ変更
"""
