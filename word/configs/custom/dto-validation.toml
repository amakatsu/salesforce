[pr_questions]
extra_instructions = "必ず日本語で質問への回答を記述してください。\n\nDTOに関する質問には以下の観点で回答してください：\n- **単語帳準拠**: 使用している用語が標準用語かどうか\n- **命名規則**: プロパティ名、クラス名の妥当性\n- **バリデーション**: 必要なバリデーションルール\n- **API互換性**: 既存APIへの影響、破壊的変更の有無\n- **ネスト構造**: DTOの階層設計の妥当性\n\n具体的なDTOコード例を含めて説明してください。\n"
enable_help_text = true

[pr_add_docs]
extra_instructions = "必ず日本語でDTOドキュメントを生成してください。\n\nDTOドキュメントには以下を含めてください：\n- クラスの目的（どのAPIで使用されるか）\n- 各プロパティの説明\n  - 意味・用途\n  - 必須/任意\n  - 型と制約（最大長、範囲、パターン等）\n  - デフォルト値\n- リクエスト/レスポンスの具体例（JSON形式）\n- バリデーションルール一覧\n- 関連するDTO（ネストDTO、継承元等）\n\nJavaDoc/TSDoc標準形式に従ってください。\n"
enable_help_text = true

[pr_update_changelog]
extra_instructions = "必ず日本語でchangelogを記述してください。\n\nDTOの変更を以下のカテゴリで分類：\n- **Added**: 新しいDTOクラス/プロパティ\n- **Changed**: プロパティ名変更、型変更、バリデーション追加\n- **Deprecated**: 非推奨化したプロパティ/DTO\n- **Removed**: 削除したプロパティ/DTO\n- **Fixed**: バグ修正（バリデーション不足、命名規則違反等）\n- **Standardized**: 単語帳準拠への修正（flg→isXxx, kbn→type等）\n\n破壊的変更（API互換性に影響）は必ず明記してください。\n"
enable_help_text = true

[pr_generate_labels]
extra_instructions = "DTOの変更内容を分析して適切なラベルを提案してください：\n\n- **変更の種類**: feature, bugfix, refactor, standardization\n- **影響範囲**: api-breaking-change, backward-compatible, new-dto\n- **品質**: validation-added, documentation-added, naming-convention-fixed\n- **単語帳**: standardized-terminology, non-standard-terms-remain\n- **優先度**: critical, high, medium, low\n- **レビュー**: needs-api-review, needs-validation-review\n"
