[pr_add_docs]
extra_instructions = """
必ず日本語でDTOドキュメントを生成してください。

DTOドキュメントには以下を含めてください：
- クラスの目的（どのAPIで使用されるか）
- 各プロパティの説明
  - 意味・用途
  - 必須/任意
  - 型と制約（最大長、範囲、パターン等）
