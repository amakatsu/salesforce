# 型の大分類マッピング（仕様書 Section 3-2）
#
# 画面項目定義の「型」、テーブル定義の「データ型」、ドメイン一覧の「データ型」を
# 大分類で紐づける。型は大分類レベルで参考にし、桁数での判断をメインとする。

categories:
  文字列系:
    screen_types:
      - テキスト
      - テキストエリア
      - テーブルカラムテキスト
    table_types:
      - CHAR
      - VARCHAR
      - VARCHAR2
      - NCHAR
      - NVARCHAR
      - NCLOB
      - CLOB
    domain_types:
      - 半角文字
      - 半角英字
      - 半角数字
      - 半角カナ
      - 半角英数字
      - 半角英数字記号
      - 全角文字
      - 全角英字
      - 全角数字
      - 全角ひらがな
      - 全角カタカナ
      - 全角英数字
      - 全角英数字記号
      - 全半角混合
      - 全半角混合文字

  数値系:
    screen_types:
      - 数値
    table_types:
      - NUMBER
      - INT
      - INTEGER
      - DECIMAL
      - FLOAT
      - NUMERIC
      - BIGINT
    domain_types:
      - 数値（整数）
      - 数値（少数）

  日付系:
    screen_types:
      - 日付
    table_types:
      - DATE
      - TIMESTAMP
    domain_types:
      - 日付

  真偽値系:
    screen_types:
      - チェックボックス
    table_types: []
    domain_types:
      - 真偽値

  コード系:
    screen_types:
      - コンボボックス
      - ラジオボタン
    table_types: []
    domain_types:
      - コード

  バイナリ系:
    screen_types: []
    table_types:
      - RAW
      - ROWID
    domain_types: []
