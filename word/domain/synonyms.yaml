# 同義語グループ定義
#
# 各グループはリストで表現。同グループ内の語は互いに同義語として扱われる。
# 新しい同義語を追加するには、該当グループに語を追加するか、
# 新しいグループをリストに追加するだけでよい。
#
# 注意:
#   - 全て小文字・NFKC正規化された状態で比較される
#   - 英字は小文字で記載すること

groups:
  - [金額, 代金, 額, 価格]
  - [名称, 名前, 名]
  - [番号, "no", ナンバー, コード, cd]
  - [日付, 日, 年月日]
  - [区分, 種別, 種類, タイプ, 分類, type]
  - [住所, アドレス, address]
  - [電話, tel, phone]
  - [メール, email, mail]
  - [フラグ, flg, flag]
  - [備考, コメント, 注記, メモ, 補記]
  - [数量, 個数, 件数]
  - [割合, 率, パーセント, "%"]
  - [期間, 期日, 締切]
  - [会社, 企業, 法人]
