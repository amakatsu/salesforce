# テキストタイプ → ドメインデータ型マッピング（仕様書 Section 3-3）
#
# 画面項目定義の「テキストタイプ」から、ドメイン一覧の「データ型」候補を絞り込む。
# テーブル定義にはテキストタイプがないため、大分類＋桁数のみで判定する。

mappings:
  半角英字:
    - 半角英字
  半角数字:
    - 半角数字
  半角英数字:
    - 半角英数字
  半角カナ文字:
    - 半角カナ
  半角文字:
    - 半角文字
    - 半角英数字記号
  全角文字:
    - 全角文字
    - 全角ひらがな
    - 全角カタカナ
  全半角混合:
    - 全半角混合

default_behavior: "全候補から桁数で判定"
