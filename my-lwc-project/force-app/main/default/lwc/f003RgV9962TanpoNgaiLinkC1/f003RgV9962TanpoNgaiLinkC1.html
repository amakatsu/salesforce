<template>
    <lightning-accordion active-section-name="section1">
        <lightning-accordion-section name="section1" label="担保">
            <lightning-card>
            <!-- Collateral/Guarantee & 担保/保証 -->
            <lightning-layout class="slds-m-bottom_xxx-small">
                <lightning-layout-item size="3" padding="horizontal-small">
                    <lightning-input
                        label="Collateral/Guarantee"
                        value={collateralGuarantee}
                        readonly
                    ></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="3" padding="horizontal-small">
                    <lightning-combobox
                        label="担保/保証"
                        value={selectedDetail}
                        options={detailOptions}
                        onchange={handleDetailChange}
                        placeholder="選択してください"
                    ></lightning-combobox>
                </lightning-layout-item>
            </lightning-layout>

            <!-- Jurisdiction -->
            <lightning-layout class="slds-m-bottom_xxx-small">
                <lightning-layout-item size="6" padding="horizontal-small">
                    <lightning-input
                        label="Jurisdiction(裁判管轄地)"
                        value={jurisdiction}
                        onchange={handleJurisdictionChange}
                    ></lightning-input>
                </lightning-layout-item>
            </lightning-layout>

            <!-- Governing Law -->
            <lightning-layout class="slds-m-bottom_xxx-small">
                <lightning-layout-item size="6" padding="horizontal-small">
                    <lightning-input
                        label="Governing Law(準拠法)"
                        value={governingLaw}
                        onchange={handleGoverningLawChange}
                    ></lightning-input>
                </lightning-layout-item>
            </lightning-layout>

            <!-- 備考 -->
            <lightning-layout>
                <lightning-layout-item size="6" padding="horizontal-small">
                    <lightning-textarea
                        label="Note(担保コメント)"
                        value={note}
                        onchange={handleNoteChange}
                        style="--slds-c-textarea-sizing-min-height: calc(1.5rem * 5)"
                    ></lightning-textarea>
                </lightning-layout-item>
            </lightning-layout>
            </lightning-card>
        </lightning-accordion-section>
    </lightning-accordion>
</template>
