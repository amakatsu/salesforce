<template>
  <lightning-card>
    <lightning-accordion active-section-name="section1">
      <lightning-accordion-section name="section1" label="担保詳細情報">
        <lightning-layout multiple-rows>
          <lightning-layout-item size="6" padding="around-small">
            <lightning-layout>
              <lightning-layout-item size="6" padding="horizontal-small">
                <lightning-input
                  label="Collateral/Guarantee"
                  value={collateralGuarantee}
                  onchange={handleCollateralChange}
                ></lightning-input>
              </lightning-layout-item>
              <lightning-layout-item size="6" padding="horizontal-small">
                <lightning-combobox
                  label="担保/保証"
                  value={selectedDetail}
                  options={detailOptions}
                  onchange={handleDetailChange}
                  placeholder="選択してください"
                ></lightning-combobox>
              </lightning-layout-item>
            </lightning-layout>
            <lightning-layout>
              <lightning-layout-item size="6" padding="horizontal-small">
                <lightning-input
                  label="Jurisdiction(裁判管轄地)"
                  value={jurisdiction}
                  onchange={handleJurisdictionChange}
                ></lightning-input>
              </lightning-layout-item>
              <lightning-layout-item size="6" padding="horizontal-small">
                <lightning-input
                  label="Governing Law(準拠法)"
                  value={governingLaw}
                  onchange={handleGoverningLawChange}
                ></lightning-input>
              </lightning-layout-item>
            </lightning-layout>
          </lightning-layout-item>
          <lightning-layout-item size="6" padding="around-small">
            <lightning-textarea
              label="Note(備考)"
              value={note}
              onchange={handleNoteChange}
              rows="4"
              style="--slds-c-textarea-sizing-min-height: calc(1.5rem * 4)"
            ></lightning-textarea>
          </lightning-layout-item>
        </lightning-layout>
      </lightning-accordion-section>
    </lightning-accordion>
  </lightning-card>
</template>
