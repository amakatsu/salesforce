<template>
    <lightning-card title="与信データ管理" icon-name="standard:account">
        <div class="slds-m-around_medium">
            <!-- データテーブル -->
            <lightning-datatable
                key-field="id"
                data={creditData}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}
                onsave={handleSave}>
            </lightning-datatable>
            
            <!-- 新規作成ボタン -->
            <div class="slds-m-top_medium">
                <lightning-button 
                    variant="brand" 
                    label="新規作成" 
                    onclick={handleCreate}>
                </lightning-button>
                <lightning-button 
                    variant="neutral" 
                    label="更新" 
                    onclick={handleRefresh}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>

    <!-- 新規作成/編集モーダル -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-form
                        object-api-name="Account"
                        fields={formFields}
                        onsuccess={handleFormSuccess}>
                    </lightning-record-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
