<template>
  <lightning-layout multiple-rows>
    <!-- 主要銀行取引状況 -->
    <lightning-layout-item size="6">
      <lightning-card>
        <div>
          <p class="section-label">主要銀行取引状況</p>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered common-table">
            <thead>
              <tr class="slds-line-height_reset">
                <template for:each={bankColumns} for:item="column">
                  <th key={column.fieldName} class="slds-text-align_center" scope="col">
                    <div class="slds-truncate" title={column.label}>{column.label}</div>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={bankRows} for:item="row">
                <tr key={row.id} class="slds-hint-parent">
                  <th data-label="bankName">{row.bankName}</th>
                  <template for:each={row.cells} for:item="cell">
                    <td key={cell.fieldName} data-label={cell.fieldName} class={cell.cellClass}>
                      <c-f003-gs-v0000-number
                        num-value={cell.value} num-label={cell.fieldName}
                        is-table="true" data-id={row.id} set-id={cell.fieldName}
                        disabled={cell.disabled} step="0.01"
                        onerror={numberErrorHandler} onchange={handleInputChange}
                      ></c-f003-gs-v0000-number>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <!-- 自己査定結果 -->
    <lightning-layout-item size="3">
      <lightning-card>
        <div class="slds-var-p-left_small">
          <div class="section-label">自己査定結果
            <span class="meta-text">金額単位： {amountUnit}</span>
          </div>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered common-table">
            <tbody>
              <template for:each={assessmentRows} for:item="item">
                <tr key={item.key}>
                  <th scope="row"><div class="slds-truncate">{item.label}</div></th>
                  <td>
                    <div class="display-value">{item.value}</div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <!-- 政策投資株式 -->
    <lightning-layout-item size="3">
      <lightning-card>
        <div class="slds-var-p-left_small">
          <p class="section-label">政策投資株式</p>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered common-table">
            <tbody>
              <template for:each={stockRows} for:item="item">
                <tr key={item.key}>
                  <th scope="row"><div class="slds-truncate">{item.label}</div></th>
                  <td>
                    <div class="display-value">{item.value}</div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <!-- 経営指標 -->
    <lightning-layout-item size="12">
      <lightning-card>
        <div class="slds-var-p-right_small">
          <p class="section-label">経営指標</p>
          <table class="slds-table indicator-table">
            <thead>
              <tr class="slds-line-height_reset">
                <template for:each={indicatorColumns} for:item="column">
                  <th key={column.fieldName} scope="col">
                    <div class="indicator-header-text slds-var-p-right_x-small" title={column.label}>
                      {column.label}
                    </div>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={indicatorRows} for:item="row">
                <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                  <th scope="row">
                    {row.type}
                    <c-f003-gs-v0000-number
                      num-value={row.period} num-label="period"
                      is-table="true" data-id={row.id} set-id="period"
                      disabled={row.disable.period} step="0.01"
                      onerror={numberErrorHandler} onchange={handleInputChange}
                    ></c-f003-gs-v0000-number>
                  </th>
                  <template for:each={row.cells} for:item="cell">
                    <td key={cell.fieldName} data-label={cell.fieldName} class={cell.cellClass}>
                      <c-f003-gs-v0000-number
                        num-value={cell.value} num-label={cell.fieldName}
                        is-table="true" data-id={row.id} set-id={cell.fieldName}
                        disabled={cell.disabled} step="0.01"
                        onerror={numberErrorHandler} onchange={handleInputChange}
                      ></c-f003-gs-v0000-number>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <lightning-layout-item size="1">
      <c-f003-gs-v0000-number
        num-value={totalValue} num-label="Ｇｒ合算実態純資産額"
        class="slds-var-p-top_large" disabled={total.disabled} step="0.01"
        onerror={numberErrorHandler} onchange={handleInputChange}
      ></c-f003-gs-v0000-number>
    </lightning-layout-item>

    <!-- メモ -->
    <lightning-layout-item size="12">
      <lightning-card>
        <div>
          <lightning-layout>
            <lightning-layout-item size="6" padding="around-x-small">
              <div class="slds-text-title_bold">メモ</div>
              <lightning-textarea
                variant="label-hidden" value={memoValue}
                disabled={memo.disabled}
                style="--sds-c-textarea-sizing-min-height: 5rem"
              ></lightning-textarea>
            </lightning-layout-item>
          </lightning-layout>
        </div>
      </lightning-card>
    </lightning-layout-item>
  </lightning-layout>
</template>
