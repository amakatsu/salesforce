<template>
  <lightning-layout multiple-rows>
    <!-- 主要銀行取引状況 -->
    <lightning-layout-item size="6">
      <lightning-card>
        <p class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-text-heading_small slds-text-title_bold slds-p-top_x-small">主要銀行取引状況</p>
        <table class="slds-table slds-table_cell-buffer slds-table_bordered common-table">
          <thead>
            <tr class="slds-line-height_reset">
              <template for:each={bankColumns} for:item="column">
                <th key={column.fieldName} scope="col">
                  <div class="slds-truncate" title={column.label}>{column.label}</div>
                </th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template for:each={bankRows} for:item="row">
              <tr key={row.id} class="slds-hint-parent">
                <th data-label="bankName">{row.bankName}</th>
                <template for:each={row.cells} for:item="cell">
                  <td key={cell.fieldName} data-label={cell.fieldName} class={cell.cellClass}>
                    <template if:true={cell.renderAsFormatted}>
                      <div class="display-value">
                        <lightning-formatted-number value={cell.value}></lightning-formatted-number>
                      </div>
                    </template>
                    <template if:false={cell.renderAsFormatted}>
                      <c-f003-gs-v0000-number
                        num-value={cell.value} num-label={cell.fieldName}
                        is-table="true" data-id={row.id} data-field={cell.fieldName}
                        set-id={cell.fieldName} disabled={cell.disabled} step="0.01"
                        onerror={numberErrorHandler} onchange={handleInputChange}
                      ></c-f003-gs-v0000-number>
                    </template>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </lightning-card>
    </lightning-layout-item>

    <!-- 自己査定結果 -->
    <lightning-layout-item size="3">
      <lightning-card>
        <div class="slds-var-p-left_small">
          <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end">
            <div>
              <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-text-heading_small slds-text-title_bold slds-p-top_x-small">自己査定結果</div>
            </div>
            <div>
              <span>金額単位： {amountUnit}</span>
            </div>
          </div>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered common-table">
            <tbody>
              <template for:each={assessmentRows} for:item="item">
                <tr key={item.key}>
                  <th scope="row"><div class="slds-truncate">{item.label}</div></th>
                  <td>
                    <div class="display-value">
                      <lightning-formatted-number value={item.value}></lightning-formatted-number>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <!-- 政策投資株式 -->
    <lightning-layout-item size="3">
      <lightning-card>
        <div class="slds-var-p-left_small">
          <p class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-text-heading_small slds-text-title_bold slds-p-top_x-small">政策投資株式</p>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered common-table">
            <tbody>
              <template for:each={stockRows} for:item="item">
                <tr key={item.key}>
                  <th scope="row"><div class="slds-truncate">{item.label}</div></th>
                  <td>
                    <div class="display-value">
                      <lightning-formatted-number value={item.value}></lightning-formatted-number>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <!-- 経営指標 -->
    <lightning-layout-item size="12">
      <lightning-card>
        <div class="slds-var-p-right_small">
          <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end">
            <div>
              <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-text-heading_small slds-text-title_bold slds-p-top_x-small">経営指標</div>
            </div>
            <div>
              <span>金額単位： {amountUnit}</span>
            </div>
          </div>
          <table class="slds-table common-table indicator-table">
            <thead>
              <tr class="slds-line-height_reset">
                <template for:each={indicatorColumns} for:item="column">
                  <th key={column.fieldName} scope="col">
                    <div class="indicator-header-text slds-var-p-right_x-small" title={column.label}>
                      {column.label}
                    </div>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={indicatorRows} for:item="row">
                <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                  <th scope="row">
                    <div class="indicator-row-head">
                      <span class="indicator-type">{row.type}</span>
                      <div class="period-cell">
                      <template if:true={row.periodDisabled}>
                        <div class="display-value">
                          <lightning-formatted-text value={row.fiscalYear}></lightning-formatted-text>
                        </div>
                        <span class="period-separator">/</span>
                        <div class="display-value">
                          <lightning-formatted-text value={row.fiscalMonth}></lightning-formatted-text>
                        </div>
                      </template>
                      <template if:false={row.periodDisabled}>
                        <lightning-input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4"
                          variant="label-hidden" value={row.fiscalYear}
                          data-id={row.id} data-field="fiscalYear"
                          onchange={handleInputChange}
                        ></lightning-input>
                        <span class="period-separator">/</span>
                        <lightning-input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2"
                          variant="label-hidden" value={row.fiscalMonth}
                          data-id={row.id} data-field="fiscalMonth"
                          onchange={handleInputChange}
                        ></lightning-input>
                      </template>
                      </div>
                    </div>
                  </th>
                  <template for:each={row.cells} for:item="cell">
                    <td key={cell.fieldName} data-label={cell.fieldName} class={cell.cellClass}>
                      <template if:true={cell.renderAsFormatted}>
                        <div class="display-value">
                          <lightning-formatted-number value={cell.value}></lightning-formatted-number>
                        </div>
                      </template>
                      <template if:false={cell.renderAsFormatted}>
                        <c-f003-gs-v0000-number
                          num-value={cell.value} num-label={cell.fieldName}
                          is-table="true" data-id={row.id} data-field={cell.fieldName}
                          set-id={cell.fieldName} disabled={cell.disabled} step="0.01"
                          onerror={numberErrorHandler} onchange={handleInputChange}
                        ></c-f003-gs-v0000-number>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <lightning-layout-item size="1">
      <div class="slds-var-p-top_large">
        <c-f003-gs-v0000-number
          num-value={total.value}
          num-label="Ｇｒ合算実態純資産額"
          disabled
        ></c-f003-gs-v0000-number>
      </div>
    </lightning-layout-item>

    <!-- メモ -->
    <lightning-layout-item size="12">
      <lightning-card>
        <lightning-layout>
          <lightning-layout-item size="6" padding="horizontal-small">
            <div class="slds-text-title_bold">メモ</div>
            <lightning-textarea
              variant="label-hidden" value={memo.value}
              disabled={memo.disabled}
              style="--sds-c-textarea-sizing-min-height: 5rem"
            ></lightning-textarea>
          </lightning-layout-item>
        </lightning-layout>
      </lightning-card>
    </lightning-layout-item>
  </lightning-layout>
</template>
