<template>
  <!-- 取引先情報 -->
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name={activeSections}
  >
    <lightning-accordion-section
      name="a"
      label="取引先情報"
      icon-name="standard:choice"
    >
      <lightning-card>
        <lightning-layout multiple-rows horizontal-align="start">
          <!-- 組織店情報 -->
          <lightning-layout-item size="12">
            <lightning-layout multiple-rows padding="horizontal-small" horizontal-align="start">
              <template for:each={organizationFields} for:item="field">
                <lightning-layout-item key={field.key} size={field.size} padding="horizontal-small">
                  <lightning-input label={field.label} value={field.value} readonly class="underline"></lightning-input>
                </lightning-layout-item>
              </template>
            </lightning-layout>
          </lightning-layout-item>

          <!-- 取引先詳細情報 -->
          <lightning-layout-item size="12">
            <lightning-layout multiple-rows padding="horizontal-small" horizontal-align="start">
              <template for:each={customerFields} for:item="field">
                <lightning-layout-item key={field.key} size={field.size} padding="horizontal-small">
                  <lightning-input label={field.label} value={field.value} readonly class="underline"></lightning-input>
                </lightning-layout-item>
              </template>
            </lightning-layout>
          </lightning-layout-item>
        </lightning-layout>
      </lightning-card>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
