<template>
  <lightning-layout multiple-rows>
    <!-- テーブル① 市場性与信状況 -->
    <lightning-layout-item size="12">
      <lightning-card>
        <div>
          <div class="section-label">市場性与信状況
            <span>
              <span class="meta-text">括り： {groupNumber}</span>
              <span class="meta-text slds-var-p-left_small">金額単位： {amountUnit}</span>
            </span>
          </div>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
              <tr class="slds-line-height_reset">
                <template for:each={creditHeaderColumns} for:item="col">
                  <th key={col.key} class={col.w} scope="col">
                    <div title={col.label}>{col.label}</div>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={creditRows} for:item="row">
                <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                  <th data-label="creditType1" class={row.creditType1Class} scope="row">
                    <div class="slds-truncate credit-type-wrap">{row.creditType1}</div>
                  </th>
                  <template for:each={row.textCells} for:item="cell">
                    <td key={cell.key} data-label={cell.field} class={cell.cellClass}>
                      <lightning-input type="text" variant="label-hidden" value={cell.value}
                        data-id={row.id} data-field={cell.field}
                        onchange={handleInputChange}></lightning-input>
                    </td>
                  </template>
                  <template for:each={row.numberCells} for:item="cell">
                    <td key={cell.key} data-label={cell.field} class={cell.cellClass}>
                      <c-f003-gs-v0000-number num-value={cell.value} num-label={cell.field}
                        is-table="true" data-id={row.id} data-field={cell.field}
                        set-id={cell.field} disabled={cell.disabled} step="0.01"
                        onerror={numberErrorHandler}
                        onchange={handleInputChange}></c-f003-gs-v0000-number>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>

    <!-- テーブル② 為替予約残高推移 -->
    <lightning-layout-item size="12">
      <lightning-card>
        <div class="slds-size_8-of-12">
          <div>
            <div class="section-label">為替予約残高推移
              <span class="meta-text">金額単位： {amountUnit}</span>
            </div>
          </div>
          <table class="slds-table slds-table_cell-buffer slds-table_bordered common-table">
            <thead>
              <tr class="slds-line-height_reset">
                <template for:each={exchangeReservationColumns} for:item="column">
                  <th key={column.fieldName} scope="col">
                    <div title={column.label}>{column.label}</div>
                  </th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={exchangeRows} for:item="row">
                <tr key={row.id} class="slds-hint-parent">
                  <th>{row.type}</th>
                  <template for:each={row.cells} for:item="cell">
                    <td key={cell.key} data-label={cell.field}>
                      <div class={cell.cellClass}>
                        <c-f003-gs-v0000-number num-value={cell.value} num-label={cell.field}
                          is-table="true" data-id={row.id} data-field={cell.field}
                          step="0.01" onerror={numberErrorHandler}
                          onchange={handleInputChange}></c-f003-gs-v0000-number>
                      </div>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-layout-item>
  </lightning-layout>
</template>
