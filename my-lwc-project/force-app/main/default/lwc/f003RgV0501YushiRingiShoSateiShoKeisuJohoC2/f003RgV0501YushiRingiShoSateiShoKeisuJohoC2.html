<template>
  <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
    <lightning-layout multiple-rows>
      <!-- 与信状況 -->
      <lightning-layout-item size="9" class="slds-grid slds-grid_vertical slds-var-p-right_large">
        <lightning-card class="slds-col slds-grow">
          <div class="slds-grid slds-grid_align-spread slds-wrap slds-p-around_none slds-m-around_none slds-grid_vertical-align-end">
            <div class="slds-p-around_none slds-m-around_none">
              <div class="section-label">{labels.accordion.CREDIT_STATUS}</div>
            </div>
            <div class="slds-grid slds-grid_align-end slds-wrap slds-p-around_none slds-m-around_none">
              <div class="meta-group slds-var-p-right_small">
                <span class="meta-text">括り： {groupNumber}</span>
              </div>
              <div class="meta-unit">
                <span class="meta-text">金額単位： {amountUnit}</span>
              </div>
            </div>
          </div>
          <div class="slds-p-around_none slds-m-around_none">
            <div class="table-sticky table-container-credit slds-p-around_none slds-m-around_none slds-size_1-of-1">
              <table role="grid" class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                  <tr class="slds-line-height_reset">
                    <th class="column-icon table-sticky__title table-sticky3__title01" scope="col"></th>
                    <th class="column-label table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.SUBJECT_SUMMARY_NUMBER}>{labels.tableHeaders.CREDIT.SUBJECT_SUMMARY_NUMBER}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.DUE_DATE}>{labels.tableHeaders.CREDIT.DUE_DATE}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.RATE}>{labels.tableHeaders.CREDIT.RATE}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.BALANCE_99}>{labels.tableHeaders.CREDIT.BALANCE_99}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.MARK}>{labels.tableHeaders.CREDIT.MARK}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.PRINCIPAL}>{labels.tableHeaders.CREDIT.PRINCIPAL}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.CHANGE}>{labels.tableHeaders.CREDIT.CHANGE}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.POST_BALANCE}>{labels.tableHeaders.CREDIT.POST_BALANCE}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.ACTUAL_BALANCE}>{labels.tableHeaders.CREDIT.ACTUAL_BALANCE}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.CREDIT.CORRECTION}>{labels.tableHeaders.CREDIT.CORRECTION}</div>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={creditRows} for:item="row">
                    <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                      <th scope="col">
                        <lightning-button-icon if:true={row.hasChildren} icon-name={row.icon}
                          variant="bare" size="small" alternative-text="toggle"
                          onclick={handleToggle} data-id={row.id}>
                        </lightning-button-icon>
                      </th>
                      <th class={row.labelClass} scope="row">
                        <template if:true={row.isSpecificCredit}>
                          <lightning-input type="text" variant="label-hidden" value={row.label}
                            data-id={row.id} data-field="label" onchange={handleEdit}>
                          </lightning-input>
                        </template>
                        <template if:false={row.isSpecificCredit}>
                          <div class="slds-truncate">{row.label}</div>
                        </template>
                      </th>
                      <td data-label="dueDate" class={row.dueDateClass}>
                        <lightning-input type="text" variant="label-hidden" value={row.dueDate}
                          data-id={row.id} data-field="dueDate" onchange={handleEdit}
                          disabled={row.dueDateDisabled}>
                        </lightning-input>
                      </td>
                      <td data-label="rate" class={row.rateClass}>
                        <c-f003-gs-v0000-number num-value={row.rate} num-label={labels.field.RATE}
                          is-table="true" data-id={row.id} set-id="rate" disabled={row.rateDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                      <td data-label="balance99" class={row.balance99Class}>
                        <c-f003-gs-v0000-number num-value={row.balance99} num-label={labels.field.BALANCE_99}
                          is-table="true" data-id={row.id} set-id="balance99" disabled={row.balance99Disabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                      <td data-label="mark" class={row.markClass}>
                        <template if:false={row.hideMark}>
                          <div class="slds-text-align_center">*</div>
                        </template>
                      </td>
                      <td data-label="principal" class={row.principalClass}>
                        <c-f003-gs-v0000-number num-value={row.principal} num-label={labels.field.PRINCIPAL}
                          is-table="true" data-id={row.id} set-id="principal" disabled={row.principalDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                      <td data-label="change" class={row.changeClass}>
                        <c-f003-gs-v0000-number num-value={row.change} num-label={labels.field.CHANGE}
                          is-table="true" data-id={row.id} set-id="change" disabled={row.changeDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                      <td data-label="postBalance" class={row.postBalanceClass}>
                        <c-f003-gs-v0000-number num-value={row.postBalance} num-label={labels.field.POST_BALANCE}
                          is-table="true" data-id={row.id} set-id="postBalance" disabled={row.postBalanceDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                      <td data-label="actualBalance" class={row.actualBalanceClass}>
                        <c-f003-gs-v0000-number num-value={row.actualBalance} num-label={labels.field.ACTUAL_BALANCE}
                          is-table="true" data-id={row.id} set-id="actualBalance" disabled={row.actualBalanceDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                      <td data-label="correction" class={row.correctionClass}>
                        <c-f003-gs-v0000-number num-value={row.correction} num-label={labels.field.CORRECTION}
                          is-table="true" data-id={row.id} set-id="correction" disabled={row.correctionDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </lightning-card>
      </lightning-layout-item>

      <!-- 保全状況(本件後) + 保証人 -->
      <lightning-layout-item size="3" class="slds-grid slds-grid_vertical">
        <lightning-card>
          <div class="slds-grid slds-grid_align-spread slds-wrap slds-p-around_none slds-m-around_none slds-grid_vertical-align-end">
            <div class="slds-p-around_none slds-m-around_none">
              <div class="section-label">{labels.accordion.COLLATERAL}</div>
            </div>
            <div class="meta-unit slds-p-around_none slds-m-around_none">
              <span class="meta-text">金額単位： {amountUnit}</span>
            </div>
          </div>
          <div class="slds-p-around_none slds-m-around_none">
            <div class="table-sticky table-container-collateral slds-p-around_none slds-m-around_none slds-size_1-of-1">
              <table role="grid" class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                  <tr class="slds-line-height_reset">
                    <th class="column-icon table-sticky__title table-sticky3__title01" scope="col"></th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.COLLATERAL.COLLATERAL_TYPE}>{labels.tableHeaders.COLLATERAL.COLLATERAL_TYPE}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={labels.tableHeaders.COLLATERAL.REG_VALUE}>{labels.tableHeaders.COLLATERAL.REG_VALUE}</div>
                    </th>
                    <th class="table-sticky__title table-sticky3__title02" scope="col">
                      <div class="slds-truncate" title={collateralMarketValueHeader}>{collateralMarketValueHeader}</div>
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={collateralRows} for:item="row">
                    <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                      <th scope="col">
                        <lightning-button-icon if:true={row.hasChildren} icon-name={row.icon}
                          variant="bare" size="small" alternative-text="toggle"
                          onclick={handleToggle} data-id={row.id}>
                        </lightning-button-icon>
                      </th>
                      <th scope="row" class={row.collateralTypeClass}>
                        <div class="slds-truncate collateral-type-wrap">{row.collateralType}</div>
                      </th>
                      <td data-label="regValue" class={row.regValueClass}>
                        <c-f003-gs-v0000-number num-value={row.regValue} num-label={labels.field.REG_VALUE}
                          is-table="true" data-id={row.id} set-id="regValue" disabled={row.regValueDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                      <td data-label="marketValue" class={row.marketValueClass}>
                        <c-f003-gs-v0000-number num-value={row.marketValue} num-label={labels.field.MARKET_VALUE}
                          is-table="true" data-id={row.id} set-id="marketValue" disabled={row.marketValueDisabled}
                          step={labels.config.DECIMAL_STEP} onerror={numberErrorHandler} onchange={handleEdit}>
                        </c-f003-gs-v0000-number>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </lightning-card>

        <!-- 保証人カード -->
        <lightning-card class="slds-col slds-grow">
          <div class="slds-var-p-horizontal_medium slds-var-p-vertical_xx-small">
            {labels.message.NAKED_CREDIT_INFO}
          </div>
          <div class="table-container-guarantor slds-size_1-of-2 slds-p-around_none slds-m-around_none">
            <table role="grid" class="slds-table slds-table_cell-buffer slds-table_bordered">
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col">
                    <div class="slds-truncate slds-text-align_center" title={labels.tableHeaders.GUARANTOR.GUARANTOR}>{labels.tableHeaders.GUARANTOR.GUARANTOR}</div>
                  </th>
                </tr>
              </thead>
              <tbody>
                <template for:each={guarantorData} for:item="row">
                  <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                    <td class={row.cellClass}>
                      <lightning-input type="text" variant="label-hidden" value={row.name}
                        onchange={handleGuarantorInput} data-id={row.id}>
                      </lightning-input>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </lightning-card>
      </lightning-layout-item>
    </lightning-layout>
  </lightning-accordion>
</template>
