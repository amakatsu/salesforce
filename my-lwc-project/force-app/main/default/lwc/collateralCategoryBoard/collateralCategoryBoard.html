<template>
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name={activeSections}
  >
    <!-- 担保条件１ -->
    <lightning-accordion-section
      name="b"
      label="担保条件１"
      icon-name="standard:choice"
    >
      <lightning-card>
        <template for:each={columns} for:item="column">
          <div key={column.id} class="slds-p-around_medium">
            <!-- 科目・大分類・小分類以降 -->
            <div class="slds-grid slds-gutters_small slds-wrap">
              <template if:true={showSubjectColumn}>
                <div class="slds-size_1-of-12 slds-p-around_xx-small">
                  <lightning-combobox
                    label="科目"
                    value={column.subject}
                    options={subjectOptions}
                    data-column-id={column.id}
                    data-field="subject"
                    onchange={handleFieldChange}
                  ></lightning-combobox>
                </div>
              </template>
              <div class="slds-size_1-of-12 slds-p-around_xx-small">
                <lightning-combobox
                  label="担保種類（大分類）"
                  value={column.majorValue}
                  options={majorOptions}
                  data-column-id={column.id}
                  onchange={handleMajorChange}
                ></lightning-combobox>
              </div>

              <!-- 小分類以降 -->
              <div
                class="collateral-board-container slds-box slds-p-around_small"
              >
                <div class="slds-grid slds-gutters_small slds-wrap">
                  <div class="slds-col slds-p-around_xx-small">
                    <lightning-combobox
                      label="担保種類（小分類）"
                      value={column.minorValue}
                      options={column.minorOptions}
                      data-column-id={column.id}
                      data-field="minorValue"
                      onchange={handleFieldChange}
                    ></lightning-combobox>
                  </div>
                  <div class="slds-col slds-p-around_xx-small">
                    <lightning-combobox
                      label="新規・既存別"
                      value={column.dealType}
                      options={dealTypeOptions}
                      data-column-id={column.id}
                      data-field="dealType"
                      onchange={handleFieldChange}
                    ></lightning-combobox>
                  </div>
                  <div class="slds-col slds-p-around_xx-small">
                    <lightning-combobox
                      label="担保設定区分"
                      value={column.setupCategory}
                      options={setupCategoryOptions}
                      data-column-id={column.id}
                      data-field="setupCategory"
                      onchange={handleFieldChange}
                    ></lightning-combobox>
                  </div>
                  <div class="slds-col slds-p-around_xx-small">
                    <lightning-combobox
                      label="担保種類区分"
                      value={column.collateralCategory}
                      options={collateralClassOptions}
                      data-column-id={column.id}
                      data-field="collateralCategory"
                      onchange={handleFieldChange}
                    ></lightning-combobox>
                  </div>
                  <div class="slds-col slds-p-around_xx-small">
                    <c-f003-gs-v0000-number
                      num-value={column.amount}
                      num-label="設定額"
                      data-id={column.id}
                      set-id="amount"
                      onchange={handleNumberChange}
                    ></c-f003-gs-v0000-number>
                  </div>
                  <div class="slds-col slds-p-around_xx-small">
                    <c-f003-gs-v0000-number
                      num-value={column.share}
                      num-label="取分"
                      data-id={column.id}
                      set-id="share"
                      onchange={handleNumberChange}
                    ></c-f003-gs-v0000-number>
                  </div>
                  <div class="slds-col slds-p-around_xx-small">
                    <lightning-combobox
                      label="評価方法"
                      value={column.extinguish}
                      options={extinguishOptions}
                      data-column-id={column.id}
                      data-field="extinguish"
                      onchange={handleFieldChange}
                    ></lightning-combobox>
                  </div>
                  <div class="slds-col slds-p-around_xx-small">
                    <lightning-combobox
                      label="根担保紐付区分"
                      value={column.rootLink}
                      options={rootLinkOptions}
                      data-column-id={column.id}
                      data-field="rootLink"
                      onchange={handleFieldChange}
                    ></lightning-combobox>
                  </div>
                </div>

                <!-- 保証・協会保証情報 -->
                <template if:true={column.isGuaranteeOrAssociation}>
                  <div class="slds-m-top_small">
                    <!-- 保証種別とカテゴリ固有フィールド -->
                    <div class="slds-grid slds-wrap slds-gutters_small">
                      <!-- 保証種別（共通） -->
                      <div class="slds-col slds-p-around_xx-small">
                        <lightning-combobox
                          label="保証種別"
                          value={column.guaranteeTypeValue}
                          options={column.guaranteeTypeOptionsForDisplay}
                          data-column-id={column.id}
                          data-field={column.guaranteeTypeField}
                          onchange={handleFieldChange}
                          field-level-help={column.guaranteeTypeHelp}
                        ></lightning-combobox>
                      </div>

                      <!-- 保証固有フィールド -->
                      <template if:true={column.isGuaranteeCategory}>
                      <div class="slds-col slds-p-around_xx-small">
                        <lightning-input
                          label="保証人名"
                          value={column.guarantorName}
                          data-column-id={column.id}
                          data-field="guarantorName"
                          onchange={handleFieldChange}
                        ></lightning-input>
                      </div>
                      <div class="slds-col slds-p-around_xx-small">
                        <lightning-combobox
                          label="保証人区分（債務者との関係）"
                          value={column.guarantorCategory}
                          options={guarantorCategoryOptions}
                          data-column-id={column.id}
                          data-field="guarantorCategory"
                          onchange={handleFieldChange}
                        ></lightning-combobox>
                      </div>
                      <div class="slds-col slds-p-around_xx-small">
                        <lightning-combobox
                          label="（法人保証の場合のみ）規定区分"
                          value={column.corporateGuaranteeCategory}
                          options={corporateGuaranteeCategoryOptions}
                          data-column-id={column.id}
                          data-field="corporateGuaranteeCategory"
                          onchange={handleFieldChange}
                        ></lightning-combobox>
                      </div>
                      </template>

                      <!-- 協会保証固有フィールド -->
                      <template if:true={column.isAssociationCategory}>
                      <div class="slds-col slds-p-around_xx-small">
                        <lightning-input
                          label="保証番号"
                          value={column.associationGuaranteeNumber}
                          data-column-id={column.id}
                          data-field="associationGuaranteeNumber"
                          onchange={handleFieldChange}
                        ></lightning-input>
                      </div>
                      <div class="slds-col slds-p-around_xx-small">
                        <lightning-combobox
                          label="既存保証回収条件"
                          value={column.associationExistingCondition}
                          options={associationExistingConditionOptions}
                          data-column-id={column.id}
                          data-field="associationExistingCondition"
                          onchange={handleFieldChange}
                        ></lightning-combobox>
                      </div>
                      <div class="slds-col slds-p-around_xx-small">
                        <lightning-combobox
                          label="承諾条件"
                          value={column.associationApprovalCondition}
                          options={associationApprovalConditionOptions}
                          data-column-id={column.id}
                          data-field="associationApprovalCondition"
                          onchange={handleFieldChange}
                        ></lightning-combobox>
                      </div>
                      </template>
                    </div>

                    <!-- 保証期間セクション（保証のみ） -->
                    <template if:true={column.isGuaranteeCategory}>
                    <div
                      class="slds-grid slds-wrap slds-gutters_small slds-m-top_x-small"
                    >
                      <div
                        class="slds-col guarantee-period-field slds-p-around_xx-small"
                      >
                        <lightning-combobox
                          label="期間・日付を選択"
                          value={column.guaranteePeriod}
                          options={guaranteePeriodOptions}
                          data-column-id={column.id}
                          data-field="guaranteePeriod"
                          onchange={handleFieldChange}
                        ></lightning-combobox>
                      </div>
                      <div class="slds-col period-year slds-p-around_xx-small">
                        <lightning-input
                          type="number"
                          label="期間（年）"
                          value={column.guaranteePeriodYears}
                          data-column-id={column.id}
                          data-field="guaranteePeriodYears"
                          onchange={handleFieldChange}
                          disabled={column.isPeriodInputDisabled}
                        ></lightning-input>
                      </div>
                      <div class="slds-col period-month slds-p-around_xx-small">
                        <lightning-input
                          type="number"
                          label="期間（カ月）"
                          value={column.guaranteePeriodMonths}
                          data-column-id={column.id}
                          data-field="guaranteePeriodMonths"
                          onchange={handleFieldChange}
                          disabled={column.isPeriodInputDisabled}
                        ></lightning-input>
                      </div>
                      <div
                        class="slds-col deadline-field slds-p-around_xx-small"
                      >
                        <lightning-input
                          type="date"
                          label="期限"
                          value={column.guaranteeDeadline}
                          data-column-id={column.id}
                          data-field="guaranteeDeadline"
                          onchange={handleFieldChange}
                          disabled={column.isDateInputDisabled}
                        ></lightning-input>
                      </div>
                    </div>
                    </template>

                    <!-- 保証期間セクション（協会保証のみ） -->
                    <template if:true={column.isAssociationCategory}>
                    <div
                      class="slds-grid slds-wrap slds-gutters_small slds-m-top_x-small"
                    >
                      <div
                        class="slds-col guarantee-period-field slds-p-around_xx-small"
                      >
                        <lightning-combobox
                          label="期間・日付を選択"
                          value={column.associationGuaranteePeriod}
                          options={guaranteePeriodOptions}
                          data-column-id={column.id}
                          data-field="associationGuaranteePeriod"
                          onchange={handleFieldChange}
                        ></lightning-combobox>
                      </div>
                      <div class="slds-col period-year slds-p-around_xx-small">
                        <lightning-input
                          type="number"
                          label="期間（年）"
                          value={column.associationPeriodYears}
                          data-column-id={column.id}
                          data-field="associationPeriodYears"
                          onchange={handleFieldChange}
                          disabled={column.isAssociationPeriodInputDisabled}
                        ></lightning-input>
                      </div>
                      <div class="slds-col period-month slds-p-around_xx-small">
                        <lightning-input
                          type="number"
                          label="期間（カ月）"
                          value={column.associationPeriodMonths}
                          data-column-id={column.id}
                          data-field="associationPeriodMonths"
                          onchange={handleFieldChange}
                          disabled={column.isAssociationPeriodInputDisabled}
                        ></lightning-input>
                      </div>
                      <div
                        class="slds-col deadline-field slds-p-around_xx-small"
                      >
                        <lightning-input
                          type="date"
                          label="期限"
                          value={column.associationDeadline}
                          data-column-id={column.id}
                          data-field="associationDeadline"
                          onchange={handleFieldChange}
                          disabled={column.isAssociationDateInputDisabled}
                        ></lightning-input>
                      </div>
                    </div>
                    </template>
                  </div>
                </template>

                <!-- 履行タイミング・期限・備考（全カテゴリ共通） -->
                <div class="slds-grid slds-gutters_small slds-wrap slds-m-top_small">
                  <div class="slds-col slds-size_3-of-12 slds-p-around_xx-small">
                    <lightning-combobox
                      label="履行タイミング"
                      value={column.timing}
                      options={timingOptions}
                      data-column-id={column.id}
                      data-field="timing"
                      onchange={handleFieldChange}
                    ></lightning-combobox>
                  </div>
                  <div class="slds-col slds-size_1-of-12 slds-p-around_xx-small">
                    <lightning-input
                      type="date"
                      label="履行期限"
                      value={column.dueDate}
                      data-column-id={column.id}
                      data-field="dueDate"
                      onchange={handleFieldChange}
                    ></lightning-input>
                  </div>
                  <div class="slds-col slds-size_8-of-12 slds-p-around_xx-small">
                    <lightning-input
                      label="備考"
                      value={column.remark}
                      data-column-id={column.id}
                      data-field="remark"
                      onchange={handleFieldChange}
                    ></lightning-input>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>

      </lightning-card>
    </lightning-accordion-section>

    <!-- 担保条件２ -->
    <lightning-accordion-section
      name="collateralDetailSection"
      label="担保条件２（１で選択できない担保条件が存在する場合や上限件数以上となる場合はこちらへ記載）"
    >
      <lightning-card>
        <lightning-layout class="slds-p-horizontal_medium slds-m-bottom_x-small">
          <lightning-layout-item size="6" padding="around-small">
            <div class="slds-text-title_caps">担保条件（追加）</div>
          </lightning-layout-item>
          <lightning-layout-item size="3" padding="around-small">
            <div class="slds-text-title_caps">履行タイミング</div>
          </lightning-layout-item>
          <lightning-layout-item size="2" padding="around-small">
            <div class="slds-text-title_caps">履行期限</div>
          </lightning-layout-item>
          <lightning-layout-item size="1" padding="around-small">
            <div class="slds-text-title_caps">操作</div>
          </lightning-layout-item>
        </lightning-layout>
        <div slot="actions">
          <lightning-button
            label="行追加"
            onclick={handleAddCollateralDetailRow}
            variant="brand"
          ></lightning-button>
        </div>
        <template for:each={collateralDetailRows} for:item="row">
          <lightning-layout key={row.id} multiple-rows class="slds-var-m-bottom_medium">
            <lightning-layout-item size="6" padding="around-small">
              <lightning-textarea
                label="担保条件（追加）"
                value={row.condition}
                data-id={row.id}
                data-field="condition"
                onchange={handleCollateralDetailRowChange}
                variant="label-hidden"
              ></lightning-textarea>
            </lightning-layout-item>
            <lightning-layout-item size="3" padding="around-small">
              <lightning-combobox
                label="履行タイミング"
                value={row.timing}
                options={timingOptions}
                data-id={row.id}
                data-field="timing"
                onchange={handleCollateralDetailRowChange}
                placeholder="タイミングを選択"
                variant="label-hidden"
              ></lightning-combobox>
            </lightning-layout-item>
            <lightning-layout-item size="2" padding="around-small">
              <lightning-input
                type="date"
                label="履行期限"
                value={row.dueDate}
                data-id={row.id}
                data-field="dueDate"
                onchange={handleCollateralDetailRowChange}
                variant="label-hidden"
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="1" padding="around-small">
              <lightning-button
                label="削除"
                onclick={handleRemoveCollateralDetailRow}
                data-id={row.id}
                variant="destructive"
              ></lightning-button>
            </lightning-layout-item>
          </lightning-layout>
        </template>
      </lightning-card>
    </lightning-accordion-section>

    <!-- 担保コメント -->
    <lightning-accordion-section name="collateralCommentSection" label="担保コメント">
      <lightning-card>
        <div class="slds-card__body">
          <lightning-textarea
            label="担保コメント"
            value={globalRemark}
            onchange={handleRemarkChange}
            style="--slds-c-textarea-sizing-min-height: calc(1.5rem * 5)"
          ></lightning-textarea>
        </div>
      </lightning-card>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
