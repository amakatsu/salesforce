<template>
    <section role="alertdialog" tabindex="-1" aria-labelledby="alert-heading" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header slds-theme_error">
                <h2 id="alert-heading" class="slds-text-heading_medium">エラー</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <div class="slds-text-align_center">
                    <lightning-icon icon-name="utility:error" size="large" variant="error"></lightning-icon>
                    <p class="slds-text-heading_small slds-m-top_medium">{code}</p>
                    <p class="slds-m-top_small">{message}</p>
                </div>
            </div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_brand" onclick={handleClose}>OK</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
