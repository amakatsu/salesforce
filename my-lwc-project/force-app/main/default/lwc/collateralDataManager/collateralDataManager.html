<template>
    <lightning-card title="担保データ管理" icon-name="standard:asset_object">
        <div class="slds-m-around_medium">
            <!-- データテーブル -->
            <lightning-datatable
                key-field="id"
                data={collateralData}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}
                onsave={handleSave}>
            </lightning-datatable>
            
            <!-- 新規作成ボタン -->
            <div class="slds-m-top_medium">
                <lightning-button 
                    variant="brand" 
                    label="新規作成" 
                    onclick={handleCreate}>
                </lightning-button>
                <lightning-button 
                    variant="neutral" 
                    label="更新" 
                    onclick={handleRefresh}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>

    <!-- 新規作成/編集モーダル -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-form slds-form_stacked">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label" for="collateralType">担保種別</label>
                            <div class="slds-form-element__control">
                                <lightning-input
                                    name="collateralType"
                                    value={formData.collateralType}
                                    onchange={handleInputChange}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element">
                            <label class="slds-form-element__label" for="regValue">規定価値</label>
                            <div class="slds-form-element__control">
                                <lightning-input
                                    type="number"
                                    name="regValue"
                                    value={formData.regValue}
                                    onchange={handleInputChange}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element">
                            <label class="slds-form-element__label" for="marketValue">市場価値</label>
                            <div class="slds-form-element__control">
                                <lightning-input
                                    type="number"
                                    name="marketValue"
                                    value={formData.marketValue}
                                    onchange={handleInputChange}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-form-element">
                            <lightning-button variant="brand" label="保存" onclick={handleFormSubmit}></lightning-button>
                            <lightning-button variant="neutral" label="キャンセル" onclick={closeModal}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
