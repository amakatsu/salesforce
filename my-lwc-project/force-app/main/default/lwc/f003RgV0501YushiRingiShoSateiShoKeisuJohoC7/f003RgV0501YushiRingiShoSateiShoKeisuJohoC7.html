<template>
  <!-- 上段: 資金使途・返済計画 -->
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name={activeSections}
  >
    <lightning-accordion-section
      name="a"
      label="資金使途・返済計画"
      icon-name="standard:choice"
    >
      <lightning-card>
        <div class="slds-var-p-horizontal_small">
          <table role="grid" class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">
                  <div class="slds-truncate" title="資金使途">資金使途</div>
                </th>
                <th scope="col">
                  <div class="slds-truncate" title="金額">金額</div>
                </th>
                <th scope="col">
                  <div class="slds-truncate" title="返済原資">返済原資</div>
                </th>
                <th scope="col">
                  <div class="slds-truncate" title="返済期間">返済期間</div>
                </th>
              </tr>
            </thead>
            <tbody>
              <template for:each={fundUseRows} for:item="row">
                <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                  <td>
                    <div class="slds-truncate">{row.use}</div>
                  </td>
                  <td>
                    <div class="slds-truncate slds-text-align_right">
                      <lightning-formatted-number value={row.amount}></lightning-formatted-number>
                    </div>
                  </td>
                  <td>
                    <div class="slds-truncate">{row.source}</div>
                  </td>
                  <td>
                    <div class="slds-truncate">{row.period}</div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-accordion-section>

    <!-- 下段: 担保・保証概要 -->
    <lightning-accordion-section
      name="b"
      label="担保・保証概要"
      icon-name="standard:choice"
    >
      <lightning-card>
        <div class="slds-var-p-horizontal_small">
          <table role="grid" class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">
                  <div class="slds-truncate" title="担保種類">担保種類</div>
                </th>
                <th scope="col">
                  <div class="slds-truncate" title="評価額">評価額</div>
                </th>
                <th scope="col">
                  <div class="slds-truncate" title="設定額">設定額</div>
                </th>
                <th scope="col">
                  <div class="slds-truncate" title="備考">備考</div>
                </th>
              </tr>
            </thead>
            <tbody>
              <template for:each={collateralSummaryRows} for:item="row">
                <tr key={row.id} class="slds-hint-parent slds-line-height_reset">
                  <td>
                    <div class="slds-truncate">{row.type}</div>
                  </td>
                  <td>
                    <div class="slds-truncate slds-text-align_right">
                      <lightning-formatted-number value={row.valuation}></lightning-formatted-number>
                    </div>
                  </td>
                  <td>
                    <div class="slds-truncate slds-text-align_right">
                      <lightning-formatted-number value={row.setting}></lightning-formatted-number>
                    </div>
                  </td>
                  <td>
                    <div class="slds-truncate">{row.note}</div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </lightning-card>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
