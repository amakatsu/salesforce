<template>
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name="{activeSections}"
  >
    <!-- 禀議査定番号・基準日 -->
    <lightning-accordion-section
      name="b"
      label="禀査番号・基準日"
      icon-name="standard:choice"
    >
      <lightning-card>
        <lightning-layout
          multiple-rows
          padding="horizontal-small"
          horizontal-align="start"
        >
          <lightning-layout-item size="2" padding="horizontal-small">
            <lightning-input
              label="禀査番号"
              value="{reviewNumber}"
              readonly
              class="underline"
            ></lightning-input>
          </lightning-layout-item>
          <lightning-layout-item size="2" padding="horizontal-small">
            <lightning-input
              label="基準日"
              value="{date}"
              readonly
              class="underline"
            ></lightning-input>
          </lightning-layout-item>
        </lightning-layout>
      </lightning-card>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
