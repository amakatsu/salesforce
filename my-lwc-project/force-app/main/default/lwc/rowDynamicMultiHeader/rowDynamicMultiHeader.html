<template>
  <!-- 
    for:eachループ使用テーブル:
    - 全行が同じ相対位置にあるため、カレンダーポップアップが一貫して下に表示される
    - 動的にデータ数が変わる場合に適している
  -->
  <lightning-card>
    <!-- テスト用ボタン -->
    <div class="slds-var-p-around_medium">
      <lightning-button-group>
        <lightning-button
          variant="brand"
          label="選択データ表示"
          onclick={handleTestSelectedData}
        ></lightning-button>
        <lightning-button
          variant="outline-brand"
          label="全データ表示"
          onclick={handleTestAllData}
        ></lightning-button>
        <lightning-button
          variant="neutral"
          label="全選択"
          onclick={handleSelectAllTest}
        ></lightning-button>
        <lightning-button
          variant="neutral"
          label="全解除"
          onclick={handleDeselectAllTest}
        ></lightning-button>
        <lightning-button
          variant="success"
          label="保存データテスト"
          onclick={handleTestSavingData}
        ></lightning-button>
      </lightning-button-group>
    </div>

    <div class="slds-grid slds-gutters slds-wrap slds-var-p-top_small">
      <div class="table-container">
        <table class="slds-table slds-table_bordered slds-table_fixed-layout">
          <!-- ★追加：colgroupで幅を確定（横スク維持のため） -->
          <colgroup>
            <col style="width: 50px" />
            <!-- 1: 選択 -->
            <col style="width: 150px" />
            <!-- 2: 横ラベル -->
            <col style="width: 200px" />
            <!-- 3: 数値1 -->
            <col style="width: 200px" />
            <!-- 4: 数値2 -->
            <col style="width: 250px" />
            <!-- 5: 文字列1 -->
            <col style="width: 350px" />
            <!-- 6: 文字列2 -->
            <col style="width: 150px" />
            <!-- 7: チェックボックス -->
            <col style="width: 200px" />
            <!-- 8: 審査結果 -->
            <col style="width: 200px" />
            <!-- 9: 科目 -->
            <col style="width: 200px" />
            <!-- 10: 日付1 -->
            <col style="width: 200px" />
            <!-- 11: 日付2 -->
          </colgroup>

          <thead>
            <!-- ★変更：ヘッダーを2行化。先頭2セルはrowspan=2で下段をまたぐ -->
            <!-- 上段：グループ -->
            <tr class="slds-line-height_reset header-row-1">
              <th
                class="slds-text-align_center col-select rowspan-2"
                style="width: 50px"
                scope="col"
                rowspan="2"
              >
                <div class="slds-truncate" title="選択">
                  <lightning-input
                    type="checkbox"
                    onchange={handleSelectFullCheck}
                    variant="label-hidden"
                  ></lightning-input>
                </div>
              </th>
              <th
                class="slds-text-align_center col-yokolabel rowspan-2"
                style="width: 150px"
                scope="col"
                rowspan="2"
              >
                <div class="slds-truncate" title="横ラベル">横ラベル</div>
              </th>

              <th class="slds-text-align_center" scope="col" colspan="2">
                <div class="slds-truncate" title="数値">数値</div>
              </th>
              <th class="slds-text-align_center" scope="col" colspan="2">
                <div class="slds-truncate" title="文字列">文字列</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="チェックボックス">
                  チェックボックス
                </div>
              </th>
              <th class="slds-text-align_center" scope="col" colspan="2">
                <div class="slds-truncate" title="審査・科目">審査・科目</div>
              </th>
              <th class="slds-text-align_center" scope="col" colspan="2">
                <div class="slds-truncate" title="日付">日付</div>
              </th>
            </tr>

            <!-- 下段：各列ラベル（先頭2セルはrowspanなので置かない） -->
            <tr class="slds-line-height_reset header-row-2">
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="数値1">数値1</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="数値2">数値2</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="文字列1">文字列1</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="文字列2">文字列2</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="チェックボックス">
                  チェック
                </div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="審査結果">審査結果</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="科目">科目</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="日付1">日付1</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="日付2">日付2</div>
              </th>
            </tr>
          </thead>

          <!-- 以降、tbodyは“最初のソースのまま” -->
          <tbody>
            <template for:each={tableData} for:item="data" for:index="idx">
              <tr key={data.Id} class="slds-hint-parent">
                <td
                  data-label="選択"
                  class="slds-text-align_center"
                  style="width: 50px"
                >
                  <lightning-input
                    type="checkbox"
                    checked={data.checked}
                    data-idx={idx}
                    onchange={handleRowSelection}
                    variant="label-hidden"
                  ></lightning-input>
                </td>
                <th
                  class="slds-text-align_center"
                  style="width: 150px"
                  scope="row"
                >
                  <div class="slds-truncate">{data.label}</div>
                </th>
                <td data-label="数値1">
                  <lightning-input
                    type="number"
                    value={data.num1}
                    data-id={data.Id}
                    data-field="num1"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>
                <td data-label="数値2">
                  <div class="slds-truncate slds-text-align_right">
                    <lightning-formatted-number
                      value={data.num2}
                    ></lightning-formatted-number>
                  </div>
                </td>
                <td data-label="文字列1">
                  <lightning-input
                    type="text"
                    value={data.str1}
                    data-id={data.Id}
                    data-field="str1"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>
                <td data-label="文字列2">
                  <div class="slds-truncate">
                    <lightning-formatted-text
                      value={data.str2}
                    ></lightning-formatted-text>
                  </div>
                </td>
                <td data-label="チェックボックス">
                  <lightning-input
                    type="checkbox"
                    checked={data.checked}
                    data-id={data.Id}
                    data-field="checked"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>
                <td data-label="審査結果">
                  <lightning-combobox
                    value={data.ReviewResult}
                    options={reviewResultOptions}
                    data-id={data.Id}
                    data-field="ReviewResult"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    dropdown-alignment="bottom"
                  ></lightning-combobox>
                </td>
                <td data-label="科目">
                  <lightning-combobox
                    value={data.Subject}
                    options={subjectOptions}
                    data-id={data.Id}
                    data-field="Subject"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    dropdown-alignment="bottom"
                  ></lightning-combobox>
                </td>
                <td data-label="日付1">
                  <lightning-input
                    type="date"
                    value={data.date1}
                    data-id={data.Id}
                    data-field="date1"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>
                <td data-label="日付2">
                  <lightning-input
                    type="date"
                    value={data.date2}
                    data-id={data.Id}
                    data-field="date2"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    readonly
                  ></lightning-input>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </lightning-card>
</template>
