<template>
  <!-- ========================================
  * 明細変動＋縦横スクロール＋直接編集可能なテーブル
  * ========================================
  -->

  <lightning-card>
    <!-- ========================================
    * テスト用ボタン群（開発・デバッグ用）利用時は消してください
    * ======================================== -->
    <div class="slds-var-p-around_medium">
      <!-- 【直接編集対応】必要最小限のテスト・操作ボタン -->
      <lightning-button-group>
        <lightning-button
          variant="outline-brand"
          label="選択データ表示"
          onclick={handleTestAllData}
        ></lightning-button>
        <lightning-button
          variant="success"
          label="保存データテスト"
          onclick={handleTestSavingData}
        ></lightning-button>
        <lightning-button
          variant="destructive"
          label="保存実行（モック）"
          onclick={handleSave}
        ></lightning-button>
      </lightning-button-group>
    </div>

    <!-- ========================================
    * メインテーブル構造
    * ======================================== -->
    <div class="slds-grid slds-gutters slds-wrap slds-var-p-top_small">
      <!-- テーブルコンテナ（CSSでスクロール制御） -->
      <div class="table-container">
        <table class="slds-table slds-table_bordered slds-table_fixed-layout">
          <!-- ========================================
          * 列幅定義（CSS変数で自動同期）
          * ======================================== -->
          <colgroup>
            <col style="width: var(--col1-width)" />
            <!-- 1: 選択（固定列） -->
            <col style="width: var(--col2-width)" />
            <!-- 2: 横ラベル（固定列） -->
            <col style="width: var(--col3-width)" />
            <!-- 3: 数値1 -->
            <col style="width: var(--col4-width)" />
            <!-- 4: 数値2 -->
            <col style="width: var(--col5-width)" />
            <!-- 5: 文字列1 -->
            <col style="width: var(--col6-width)" />
            <!-- 6: 文字列2 -->
            <col style="width: var(--col7-width)" />
            <!-- 7: 文字列3 -->
            <col style="width: var(--col8-width)" />
            <!-- 8: チェックボックス -->
            <col style="width: var(--col9-width)" />
            <!-- 9: 審査結果 -->
            <col style="width: var(--col10-width)" />
            <!-- 10: 科目 -->
            <col style="width: var(--col11-width)" />
            <!-- 11: 日付1 -->
            <col style="width: var(--col12-width)" />
            <!-- 12: 日付2 -->
          </colgroup>

          <!-- ========================================
          * ヘッダー構造（2行構成）
          * ======================================== -->
          <thead>
            <!-- 1行目：グループヘッダー -->
            <tr class="slds-line-height_reset header-row-1">
              <!-- 固定列1: 選択チェックボックス（2行分占有） -->
              <th
                class="slds-text-align_center col-select rowspan-2"
                scope="col"
                rowspan="2"
              >
                <div class="slds-truncate" title="選択">
                  <lightning-input
                    type="checkbox"
                    onchange={handleSelectFullCheck}
                    variant="label-hidden"
                  ></lightning-input>
                </div>
              </th>

              <!-- 固定列2: 横ラベル（2行分占有） -->
              <th
                class="slds-text-align_center col-yokolabel rowspan-2"
                scope="col"
                rowspan="2"
              >
                <div class="slds-truncate" title="横ラベル">横ラベル</div>
              </th>

              <!-- 数値グループ（2列分） -->
              <th class="slds-text-align_center" scope="col" colspan="2">
                <div class="slds-truncate" title="数値">数値</div>
              </th>

              <!-- 文字列グループ（3列分） -->
              <th class="slds-text-align_center" scope="col" colspan="3">
                <div class="slds-truncate" title="文字列">文字列</div>
              </th>

              <!-- チェックボックス（1列） -->
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="チェックボックス">
                  チェックボックス
                </div>
              </th>

              <!-- 審査・科目グループ（2列分） -->
              <th class="slds-text-align_center" scope="col" colspan="2">
                <div class="slds-truncate" title="審査・科目">審査・科目</div>
              </th>

              <!-- 日付グループ（2列分） -->
              <th class="slds-text-align_center" scope="col" colspan="2">
                <div class="slds-truncate" title="日付">日付</div>
              </th>
            </tr>

            <!-- 2行目：詳細ヘッダー（固定列2つはrowspanでスキップ） -->
            <tr class="slds-line-height_reset header-row-2">
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="数値1">数値1</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="数値2">数値2</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="文字列1">文字列1</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="文字列2">文字列2</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="文字列3">文字列3</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="チェックボックス">
                  チェック
                </div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="審査結果">審査結果</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="科目">科目</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="日付1">日付1</div>
              </th>
              <th class="slds-text-align_center" scope="col">
                <div class="slds-truncate" title="日付2">日付2</div>
              </th>
            </tr>
          </thead>

          <!-- ========================================
          * データ構造（1レコード = 2行表示）
          * ======================================== -->
          <tbody>
            <template for:each={tableData} for:item="data" for:index="idx">
              <!-- 1行目：上段データ -->
              <tr key={data.Id} class="slds-hint-parent">
                <!-- 固定列1: 選択チェックボックス（2行分占有） -->
                <td
                  data-label="選択"
                  class="slds-text-align_center"
                  rowspan="2"
                >
                  <lightning-input
                    type="checkbox"
                    checked={data.checked}
                    data-idx={idx}
                    onchange={handleRowSelection}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 固定列2: 横ラベル（2行分占有） -->
                <th class="slds-text-align_center" scope="row" rowspan="2">
                  <div class="slds-truncate">{data.label}</div>
                </th>

                <!-- 数値1（編集可能） -->
                <td data-label="数値1">
                  <lightning-input
                    type="number"
                    value={data.num1}
                    data-id={data.Id}
                    data-field="num1"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 数値2（表示のみ） -->
                <td data-label="数値2">
                  <div class="slds-truncate slds-text-align_right">
                    <lightning-formatted-number
                      value={data.num2}
                    ></lightning-formatted-number>
                  </div>
                </td>

                <!-- 文字列1（編集可能） -->
                <td data-label="文字列1">
                  <lightning-input
                    type="text"
                    value={data.str1}
                    data-id={data.Id}
                    data-field="str1"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 文字列2（表示のみ） -->
                <td data-label="文字列2">
                  <div class="slds-truncate">
                    <lightning-formatted-text
                      value={data.str2}
                    ></lightning-formatted-text>
                  </div>
                </td>

                <!-- 文字列3（編集可能） -->
                <td data-label="文字列3">
                  <lightning-input
                    type="text"
                    value={data.str3}
                    data-id={data.Id}
                    data-field="str3"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- チェックボックス（データ用） -->
                <td data-label="チェックボックス">
                  <lightning-input
                    type="checkbox"
                    checked={data.dataCheck}
                    data-id={data.Id}
                    data-field="dataCheck"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 審査結果（コンボボックス） -->
                <td data-label="審査結果">
                  <lightning-combobox
                    value={data.ReviewResult}
                    options={reviewResultOptions}
                    data-id={data.Id}
                    data-field="ReviewResult"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    dropdown-alignment="bottom"
                  ></lightning-combobox>
                </td>

                <!-- 科目（コンボボックス） -->
                <td data-label="科目">
                  <lightning-combobox
                    value={data.Subject}
                    options={subjectOptions}
                    data-id={data.Id}
                    data-field="Subject"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    dropdown-alignment="bottom"
                  ></lightning-combobox>
                </td>

                <!-- 日付1（編集可能） -->
                <td data-label="日付1">
                  <lightning-input
                    type="date"
                    value={data.date1}
                    data-id={data.Id}
                    data-field="date1"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 日付2（読み取り専用） -->
                <td data-label="日付2">
                  <lightning-input
                    type="date"
                    value={data.date2}
                    data-id={data.Id}
                    data-field="date2"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    readonly
                  ></lightning-input>
                </td>
              </tr>

              <!-- 2行目：下段データ（固定列2つはrowspanでスキップ） -->
              <tr key={data.Id} class="slds-hint-parent second-row">
                <!-- 数値3（編集可能） -->
                <td data-label="数値3">
                  <lightning-input
                    type="number"
                    value={data.num3}
                    data-id={data.Id}
                    data-field="num3"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 数値4（表示のみ） -->
                <td data-label="数値4">
                  <div class="slds-truncate slds-text-align_right">
                    <lightning-formatted-number
                      value={data.num4}
                    ></lightning-formatted-number>
                  </div>
                </td>

                <!-- 文字列4（編集可能） -->
                <td data-label="文字列4">
                  <lightning-input
                    type="text"
                    value={data.str4}
                    data-id={data.Id}
                    data-field="str4"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 文字列5（テキストエリア） -->
                <td data-label="文字列5">
                  <lightning-textarea
                    value={data.str5}
                    data-id={data.Id}
                    data-field="str5"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-textarea>
                </td>

                <!-- 文字列6（編集可能） -->
                <td data-label="文字列6">
                  <lightning-input
                    type="text"
                    value={data.str6}
                    data-id={data.Id}
                    data-field="str6"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- チェック2 -->
                <td data-label="チェック2">
                  <lightning-input
                    type="checkbox"
                    checked={data.checked2}
                    data-id={data.Id}
                    data-field="checked2"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 優先度（コンボボックス） -->
                <td data-label="優先度">
                  <lightning-combobox
                    value={data.Priority}
                    options={priorityOptions}
                    data-id={data.Id}
                    data-field="Priority"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    dropdown-alignment="bottom"
                  ></lightning-combobox>
                </td>

                <!-- ステータス（コンボボックス） -->
                <td data-label="ステータス">
                  <lightning-combobox
                    value={data.Status}
                    options={statusOptions}
                    data-id={data.Id}
                    data-field="Status"
                    onchange={handleInputChange}
                    variant="label-hidden"
                    dropdown-alignment="bottom"
                  ></lightning-combobox>
                </td>

                <!-- 日付3（編集可能） -->
                <td data-label="日付3">
                  <lightning-input
                    type="date"
                    value={data.date3}
                    data-id={data.Id}
                    data-field="date3"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>

                <!-- 日付4（編集可能） -->
                <td data-label="日付4">
                  <lightning-input
                    type="date"
                    value={data.date4}
                    data-id={data.Id}
                    data-field="date4"
                    onchange={handleInputChange}
                    variant="label-hidden"
                  ></lightning-input>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </lightning-card>
</template>
