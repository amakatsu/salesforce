<template>
    <lightning-accordion
        allow-multiple-sections-open
        active-section-name={activeSections}
    >
        <lightning-accordion-section
            name="b"
            label="担保条件・備考"
            icon-name="standard:choice"
        >
            <lightning-card>

            <!-- 担保条件１ -->
            <template if:true={showCollateralConditions}>
                <template for:each={columns} for:item="column">
                    <div key={column.id} class="slds-p-around_medium">
                        <!-- 科目・大分類・小分類以降 -->
                        <div class="slds-grid slds-gutters_small slds-wrap">
                            <template if:true={showSubjectColumn}>
                                <div class="slds-size_1-of-12 slds-p-horizontal_xx-small">
                                    <lightning-combobox
                                        label="科目"
                                        value={column.subject}
                                        options={subjectOptions}
                                        data-column-id={column.id}
                                        data-field="subject"
                                        onchange={handleFieldChange}
                                    ></lightning-combobox>
                                </div>
                            </template>
                            <div class="slds-size_1-of-12 slds-p-horizontal_xx-small">
                                <lightning-combobox
                                    label="担保種類(大分類)"
                                    value={column.majorValue}
                                    options={majorOptions}
                                    data-column-id={column.id}
                                    onchange={handleMajorChange}
                                ></lightning-combobox>
                            </div>

                            <!-- 小分類以降 -->
                            <div class="collateral-board-container slds-box slds-p-around_small slds-m-left_medium">
                                <div class="slds-grid slds-gutters_small slds-wrap">
                                    <div class="slds-col field-default slds-p-horizontal_xx-small">
                                        <lightning-combobox
                                            label="担保種類(小分類)"
                                            value={column.minorValue}
                                            options={column.minorOptions}
                                            data-column-id={column.id}
                                            data-field="minorValue"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="slds-col field-default slds-p-horizontal_xx-small">
                                        <lightning-combobox
                                            label="新規・既存別"
                                            value={column.dealType}
                                            options={dealTypeOptions}
                                            data-column-id={column.id}
                                            data-field="dealType"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="slds-col field-default slds-p-horizontal_xx-small">
                                        <lightning-combobox
                                            label="担保設定区分"
                                            value={column.setupCategory}
                                            options={column.collateralSettingOptions}
                                            data-column-id={column.id}
                                            data-field="setupCategory"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="slds-col field-default slds-p-horizontal_xx-small">
                                        <lightning-combobox
                                            label="担保種類区分"
                                            value={column.collateralCategory}
                                            options={column.collateralTypeOptions}
                                            data-column-id={column.id}
                                            data-field="collateralCategory"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="slds-col field-fixed amount-field slds-p-horizontal_xx-small">
                                        <c-f003-gs-v0000-number
                                            num-value={column.amount}
                                            num-label="設定額"
                                            data-id={column.id}
                                            set-id="amount"
                                            onchange={handleNumberChange}
                                        ></c-f003-gs-v0000-number>
                                    </div>
                                    <div class="slds-col field-fixed amount-field slds-p-horizontal_xx-small">
                                        <c-f003-gs-v0000-number
                                            num-value={column.share}
                                            num-label="取分"
                                            data-id={column.id}
                                            set-id="share"
                                            onchange={handleNumberChange}
                                        ></c-f003-gs-v0000-number>
                                    </div>
                                    <div class="slds-col field-default slds-p-horizontal_xx-small">
                                        <lightning-combobox
                                            label="(動産・不動産のみ)評価方法"
                                            value={column.extinguish}
                                            options={extinguishOptions}
                                            data-column-id={column.id}
                                            data-field="extinguish"
                                            onchange={handleFieldChange}
                                            disabled={column.isExtinguishDisabled}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="slds-col field-default slds-p-horizontal_xx-small">
                                        <lightning-combobox
                                            label="根担保紐付区分"
                                            value={column.rootLink}
                                            options={rootLinkOptions}
                                            data-column-id={column.id}
                                            data-field="rootLink"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </div>
                                </div>

                                <!-- 保証・協会保証情報 -->
                                <template if:true={column.isGuaranteeOrAssociation}>
                                    <div class="slds-m-top_small">

                                        <!-- 保証種別とカテゴリ固有フィールド -->
                                        <div class="slds-grid slds-wrap slds-gutters_small">

                                            <!-- 保証種別(共通) -->
                                            <div class="slds-col field-default slds-p-horizontal_xx-small">
                                                <lightning-combobox
                                                    label="保証種別"
                                                    value={column.guaranteeTypeValue}
                                                    options={column.guaranteeTypeOptionsForDisplay}
                                                    data-column-id={column.id}
                                                    data-field={column.guaranteeTypeField}
                                                    onchange={handleFieldChange}
                                                    field-level-help={column.guaranteeTypeHelp}
                                                ></lightning-combobox>
                                            </div>

                                            <!-- 保証固有フィールド -->
                                            <template if:true={column.isGuaranteeCategory}>
                                                <div class="slds-col field-fixed guarantor-name-field slds-p-horizontal_xx-small">
                                                    <lightning-input
                                                        label="保証人名"
                                                        value={column.guarantorName}
                                                        data-column-id={column.id}
                                                        data-field="guarantorName"
                                                        onchange={handleFieldChange}
                                                        max-length="30"
                                                        field-level-help="例：123-1234567 三菱 太郎"
                                                    ></lightning-input>
                                                </div>
                                                <div class="slds-col field-default slds-p-horizontal_xx-small">
                                                    <lightning-combobox
                                                        label="保証人区分(債務者との関係)"
                                                        value={column.guarantorCategory}
                                                        options={column.guarantorCategoryOptions}
                                                        data-column-id={column.id}
                                                        data-field="guarantorCategory"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                </div>
                                                <div class="slds-col field-default slds-p-horizontal_xx-small">
                                                    <lightning-combobox
                                                        label="(法人保証の場合のみ)規定区分"
                                                        value={column.corporateGuaranteeCategory}
                                                        options={corporateGuaranteeCategoryOptions}
                                                        data-column-id={column.id}
                                                        data-field="corporateGuaranteeCategory"
                                                        onchange={handleFieldChange}
                                                        disabled={column.isCorporateGuaranteeCategoryDisabled}
                                                    ></lightning-combobox>
                                                </div>
                                            </template>

                                            <!-- 協会保証固有フィールド -->
                                            <template if:true={column.isAssociationCategory}>
                                                <div class="slds-col field-fixed guarantee-number-field slds-p-horizontal_xx-small">
                                                    <lightning-input
                                                        label="保証番号"
                                                        value={column.associationGuaranteeNumber}
                                                        data-column-id={column.id}
                                                        data-field="associationGuaranteeNumber"
                                                        onchange={handleFieldChange}
                                                        max-length="25"
                                                        pattern="[a-zA-Z0-9]*"
                                                        message-when-pattern-mismatch="半角英数字で入力してください"
                                                    ></lightning-input>
                                                </div>
                                                <div class="slds-col field-default slds-p-horizontal_xx-small">
                                                    <lightning-combobox
                                                        label="既存保証回収条件"
                                                        value={column.associationExistingCondition}
                                                        options={associationExistingConditionOptions}
                                                        data-column-id={column.id}
                                                        data-field="associationExistingCondition"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                </div>
                                                <div class="slds-col field-default slds-p-horizontal_xx-small">
                                                    <lightning-combobox
                                                        label="担保充当条件(保証条件)"
                                                        value={column.associationApprovalCondition}
                                                        options={associationApprovalConditionOptions}
                                                        data-column-id={column.id}
                                                        data-field="associationApprovalCondition"
                                                        onchange={handleFieldChange}
                                                    ></lightning-combobox>
                                                </div>
                                            </template>

                                        </div>

                                        <!-- 保証期間セクション(一般保証・協会保証共通) -->
                                        <template if:true={column.isGuaranteeOrAssociation}>
                                            <div class="slds-grid slds-wrap slds-gutters_small slds-m-top_x-small">
                                                <div class="slds-col field-fixed guarantee-period-field slds-p-horizontal_xx-small">
                                                    <lightning-combobox
                                                        label="期間・日付を選択"
                                                        value={column.periodValue}
                                                        options={guaranteePeriodOptions}
                                                        data-column-id={column.id}
                                                        data-field={column.periodField}
                                                        onchange={handleFieldChange}
                                                        disabled={column.isExecutionScheduleDisabled}
                                                    ></lightning-combobox>
                                                </div>
                                                <div class="slds-col field-fixed period-year slds-p-horizontal_xx-small">
                                                    <lightning-input
                                                        type="number"
                                                        label="期間(年)"
                                                        value={column.periodYearsValue}
                                                        data-column-id={column.id}
                                                        data-field={column.periodYearsField}
                                                        onchange={handleFieldChange}
                                                        disabled={column.isPeriodInputDisabled}
                                                    ></lightning-input>
                                                </div>
                                                <div class="slds-col field-fixed period-month slds-p-horizontal_xx-small">
                                                    <lightning-input
                                                        type="number"
                                                        label="期間(カ月)"
                                                        value={column.periodMonthsValue}
                                                        data-column-id={column.id}
                                                        data-field={column.periodMonthsField}
                                                        onchange={handleFieldChange}
                                                        disabled={column.isPeriodInputDisabled}
                                                    ></lightning-input>
                                                </div>
                                                <div class="slds-col field-fixed deadline-field slds-p-horizontal_xx-small">
                                                    <lightning-input
                                                        type="date"
                                                        label="期日"
                                                        value={column.deadlineValue}
                                                        data-column-id={column.id}
                                                        data-field={column.deadlineField}
                                                        onchange={handleFieldChange}
                                                        disabled={column.isDateInputDisabled}
                                                    ></lightning-input>
                                                </div>
                                            </div>
                                        </template>

                                    </div>
                                </template>

                                <!-- 履行タイミング・期限・備考(全カテゴリ共通) -->
                                <div class="slds-grid slds-gutters_small slds-wrap slds-m-top_small">
                                    <div class="slds-col slds-size_2-of-12 slds-p-horizontal_xx-small">
                                        <lightning-combobox
                                            label="履行タイミング"
                                            value={column.timing}
                                            options={timingOptions}
                                            data-column-id={column.id}
                                            data-field="timing"
                                            onchange={handleFieldChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12 slds-p-horizontal_xx-small">
                                        <lightning-input
                                            type="date"
                                            label="履行期限"
                                            value={column.dueDate}
                                            data-column-id={column.id}
                                            data-field="dueDate"
                                            onchange={handleFieldChange}
                                            disabled={column.isDueDateDisabled}
                                        ></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_5-of-12 slds-p-horizontal_xx-small">
                                        <lightning-input
                                            label="備考"
                                            value={column.remark}
                                            data-column-id={column.id}
                                            data-field="remark"
                                            onchange={handleFieldChange}
                                        ></lightning-input>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </template>
            </template>

            <!-- 担保条件２(追加行) -->
            <template if:true={showCollateralConditions}>
                <div class="slds-p-horizontal_small slds-m-bottom_small">
                    <lightning-button
                        label="追加"
                        onclick={handleAddCollateralDetailRow}
                    ></lightning-button>
                    <lightning-helptext
                        content="担保条件で記載できない場合は「追加」を利用"
                        class="slds-var-m-left_small"
                    ></lightning-helptext>
                </div>

                <lightning-layout
                    class="slds-text-title_caps slds-m-bottom_xxx-small"
                >
                    <lightning-layout-item size="7" padding="horizontal-small">
                        担保条件(追加)
                    </lightning-layout-item>
                    <lightning-layout-item size="2" padding="horizontal-small">
                        履行タイミング
                    </lightning-layout-item>
                    <lightning-layout-item size="1" padding="horizontal-small">
                        履行期限
                    </lightning-layout-item>
                </lightning-layout>

                <template for:each={collateralDetailRows} for:item="row">
                    <lightning-layout
                        key={row.id}
                        multiple-rows
                        class="slds-var-m-bottom_medium"
                    >
                        <lightning-layout-item size="7" padding="horizontal-small">
                            <lightning-input
                                label="担保条件(追加)"
                                value={row.condition}
                                data-id={row.id}
                                data-field="condition"
                                onchange={handleCollateralDetailRowChange}
                                variant="label-hidden"
                            ></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="2" padding="horizontal-small">
                            <lightning-combobox
                                label="履行タイミング"
                                value={row.timing}
                                options={timingOptions}
                                data-id={row.id}
                                data-field="timing"
                                onchange={handleCollateralDetailRowChange}
                                placeholder="タイミングを選択"
                                variant="label-hidden"
                            ></lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="1" padding="horizontal-small">
                            <lightning-input
                                type="date"
                                label="履行期限"
                                value={row.dueDate}
                                data-id={row.id}
                                data-field="dueDate"
                                onchange={handleCollateralDetailRowChange}
                                variant="label-hidden"
                            ></lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="1" padding="horizontal-small">
                            <lightning-button
                                label="削除"
                                onclick={handleRemoveCollateralDetailRow}
                                data-id={row.id}
                            ></lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
            </template>

            <!-- 備考(アコーディオン内) -->
            <lightning-layout multiple-rows>
                <lightning-layout-item size={remarksSize} padding="horizontal-small">
                    <lightning-textarea
                        label="備考"
                        value={globalRemark}
                        onchange={handleRemarksChange}
                        field-level-help={remarksFieldLevelHelp}
                        style="--slds-c-textarea-sizing-min-height: calc(1.5rem * 4)"
                    ></lightning-textarea>
                </lightning-layout-item>
            </lightning-layout>
            </lightning-card>
        </lightning-accordion-section>
    </lightning-accordion>
</template>
