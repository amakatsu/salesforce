<template>
    <template lwc:if={isSpinnerVisible}>
        <lightning-spinner
            alternative-text="Loading"
            size="medium"
            class="slds-is-fixed"
        ></lightning-spinner>
    </template>

    <template lwc:if={isAllVisible}>
        <div class="card">
            <lightning-card>
                <template lwc:if={isServerErrorVisible}>
                    <div class="slds-var-p-right_small slds-var-p-left_small slds-var-p-bottom_small">
                        <c-f003-gs-v0000-server-error records={errors}></c-f003-gs-v0000-server-error>
                    </div>
                </template>

                <div>
                    <p>融資</p>
                    <c-f003-rg-v9951-honken-joken-basic-c1 parent-screen-type="default"></c-f003-rg-v9951-honken-joken-basic-c1>
                </div>
                <div>
                    <p>輸出/輸入</p>
                    <c-f003-rg-v9951-honken-joken-basic-c1 parent-screen-type="patternInExport"></c-f003-rg-v9951-honken-joken-basic-c1>
                </div>
                <div>
                    <p>ABCP（本来はコメントのみ、最大文字数も異なる）</p>
                    <c-f003-rg-v9951-honken-joken-basic-c1 parent-screen-type="patternAbcp"></c-f003-rg-v9951-honken-joken-basic-c1>
                </div>

                <div>
                    <p>担保（融資）</p>
                    <c-f003-rg-v9961-tanpo-basic-c1 parent-screen-type="pattern1"></c-f003-rg-v9961-tanpo-basic-c1>
                </div>
                <div>
                    <p>融資（支払承諾）・輸出・輸入・市場性（１件のみ）</p>
                    <c-f003-rg-v9961-tanpo-basic-c1 parent-screen-type="pattern2"></c-f003-rg-v9961-tanpo-basic-c1>
                </div>
                <div>
                    <p>ABCP</p>
                    <c-f003-rg-v9961-tanpo-basic-c1 parent-screen-type="pattern3"></c-f003-rg-v9961-tanpo-basic-c1>
                </div>

                <!-- 画面構成図に従って画面用のHTMLを実装するエリア Start -->

                <!-- 操作ボタン群 -->
                <div>
                    <p>内外</p>
                    <c-f003-rg-v9952-honken-joken-ngai-link-c1></c-f003-rg-v9952-honken-joken-ngai-link-c1>
                    <c-f003-rg-v9962-tanpo-ngai-link-c1></c-f003-rg-v9962-tanpo-ngai-link-c1>
                </div>

                <!-- 画面構成図に従って画面用のHTMLを実装するエリア End -->
            </lightning-card>
        </div>
    </template>

    <template lwc:if={isAccessErrorVisible}>
        <lightning-card>
            <c-f003-gs-v0000-access-error records={errors}></c-f003-gs-v0000-access-error>
        </lightning-card>
    </template>
</template>
