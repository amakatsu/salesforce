<template>
    <template lwc:if={isSpinnerVisible}>
        <lightning-spinner
            alternative-text="Loading"
            size="medium"
            class="slds-is-fixed"
        ></lightning-spinner>
    </template>

    <template lwc:if={isAllVisible}>
        <div class="card">
            <lightning-card>
                <template lwc:if={isServerErrorVisible}>
                    <div class="slds-var-p-right_small slds-var-p-left_small slds-var-p-bottom_small">
                        <c-f003-gs-v0000-server-error records={errors}></c-f003-gs-v0000-server-error>
                    </div>
                </template>

                <lightning-tabset>
                    <lightning-tab label="本件条件">
                        <lightning-tabset>
                            <lightning-tab label="融資">
                                <c-f003-rg-v9951-honken-joken-basic-c1 parent-screen-type="patternYushi"></c-f003-rg-v9951-honken-joken-basic-c1>
                            </lightning-tab>
                            <lightning-tab label="輸出/輸入">
                                <c-f003-rg-v9951-honken-joken-basic-c1 parent-screen-type="patternYushutsuYunyu"></c-f003-rg-v9951-honken-joken-basic-c1>
                            </lightning-tab>
                            <lightning-tab label="内外">
                                <c-f003-rg-v9952-honken-joken-ngai-link-c1></c-f003-rg-v9952-honken-joken-ngai-link-c1>
                            </lightning-tab>
                        </lightning-tabset>
                    </lightning-tab>
                    <lightning-tab label="担保">
                        <lightning-tabset>
                            <lightning-tab label="融資">
                                <c-f003-rg-v9961-tanpo-basic-c1 parent-screen-type="patternYushi"></c-f003-rg-v9961-tanpo-basic-c1>
                            </lightning-tab>
                            <lightning-tab label="支払承諾・輸出・輸入・市場性">
                                <c-f003-rg-v9961-tanpo-basic-c1 parent-screen-type="patternShiharaiYushutsuYunyuShijosei"></c-f003-rg-v9961-tanpo-basic-c1>
                            </lightning-tab>
                            <lightning-tab label="内外">
                                <c-f003-rg-v9962-tanpo-ngai-link-c1></c-f003-rg-v9962-tanpo-ngai-link-c1>
                            </lightning-tab>
                        </lightning-tabset>
                    </lightning-tab>
                    <lightning-tab label="ABCP">
                        <lightning-layout>
                            <lightning-layout-item size="6">
                                <c-f003-rg-v9951-honken-joken-basic-c1 parent-screen-type="patternAbcp"></c-f003-rg-v9951-honken-joken-basic-c1>
                            </lightning-layout-item>
                            <lightning-layout-item size="6">
                                <c-f003-rg-v9961-tanpo-basic-c1 parent-screen-type="patternAbcp"></c-f003-rg-v9961-tanpo-basic-c1>
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-tab>
                </lightning-tabset>
            </lightning-card>
        </div>
    </template>

    <template lwc:if={isAccessErrorVisible}>
        <lightning-card>
            <c-f003-gs-v0000-access-error records={errors}></c-f003-gs-v0000-access-error>
        </lightning-card>
    </template>
</template>
