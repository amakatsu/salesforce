<template>
  <template lwc:if={hasErrors}>
    <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
      <h2>アクセス権限エラー</h2>
      <template for:each={records} for:item="error">
        <p key={error.message}>{error.message}</p>
      </template>
    </div>
  </template>
</template>
