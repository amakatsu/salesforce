<template>
  <div class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">
            <span>利率・係数情報</span>
          </h2>
        </div>
      </header>
    </div>
    <div class="slds-card__body slds-card__body_inner">
      <lightning-tabset active-tab-value={activeTab}>
        <lightning-tab label="利率情報" value="riritu">
          <!-- 動的テーブルコンポーネント -->
          <div class="slds-grid slds-gutters slds-wrap">
            <!-- OPC テーブル -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <div class="slds-box slds-theme_default">
                <h3
                  class="slds-text-heading_small slds-m-bottom_small slds-text-align_center"
                >
                  🔧 １行テーブル
                </h3>
                <c-row-dynamic-o-p-c
                  table-data={multiHeaderData}
                  onfieldchange={handleFieldChange}
                  onvalidationerror={handleValidationError}
                ></c-row-dynamic-o-p-c>

                <!-- 保存ボタン -->
                <div class="slds-text-align_center slds-m-top_small">
                  <lightning-button
                    variant="brand"
                    label="保存"
                    data-component="opc"
                    onclick={handleSave}
                  >
                  </lightning-button>
                </div>
              </div>
            </div>

            <!-- マルチヘッダー テーブル -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
              <div class="slds-box slds-theme_default">
                <h3
                  class="slds-text-heading_small slds-m-bottom_small slds-text-align_center"
                >
                  📊 マルチヘッダー テーブル
                </h3>
                <c-row-dynamic-multi-header
                  table-data={multiHeaderData}
                  onfieldchange={handleFieldChange}
                  onvalidationerror={handleValidationError}
                >
                </c-row-dynamic-multi-header>

                <!-- 保存ボタン -->
                <div class="slds-text-align_center slds-m-top_small">
                  <lightning-button
                    variant="brand"
                    label="保存"
                    data-component="multi"
                    onclick={handleSave}
                  >
                  </lightning-button>
                </div>
              </div>
            </div>
          </div>
        </lightning-tab>
        <lightning-tab label="係数情報" value="keisu">
          <c-keisu data={keisuData}></c-keisu>
        </lightning-tab>
      </lightning-tabset>
    </div>
  </div>
</template>
