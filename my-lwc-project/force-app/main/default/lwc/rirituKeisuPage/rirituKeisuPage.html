<template>
  <div class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">
            <span>利率・係数情報</span>
          </h2>
        </div>
      </header>
    </div>
    <div class="slds-card__body slds-card__body_inner">
      <lightning-tabset active-tab-value={activeTab}>
        <lightning-tab label="利率情報" value="riritu">
          <c-riritu data={rirituData}></c-riritu>

          <div class="slds-m-top_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_small">サンプルコンポーネント</h3>
            <c-fixed-details></c-fixed-details>
            <c-row-dynamic-sample1></c-row-dynamic-sample1>
          </div>

          <div class="slds-m-top_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_small">POC コンポーネント</h3>
            <c-row-dynamic-o-p-c></c-row-dynamic-o-p-c>

            <!-- 親の検証・保存ボタン -->
            <div class="slds-m-top_medium slds-m-bottom_medium">
              <lightning-button-group>
                <lightning-button
                  variant="outline-brand"
                  label="バリデーション検証"
                  onclick={handleValidationTest}>
                </lightning-button>
                <lightning-button
                  variant="brand"
                  label="親から保存・バリデーション実行"
                  onclick={handleSave}>
                </lightning-button>
              </lightning-button-group>
            </div>

            <c-row-dynamic-multi-header
              table-data={multiHeaderData}
              onfieldchange={handleFieldChange}>
            </c-row-dynamic-multi-header>

            <!-- デバッグ情報表示エリア -->
            <template if:true={debugInfo}>
              <div class="slds-m-top_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">デバッグ情報</h3>
                <div class="slds-box slds-theme_shade">
                  <pre class="slds-text-body_small" style="white-space: pre-wrap; font-family: monospace;">{debugInfo}</pre>
                </div>
              </div>
            </template>
          </div>
        </lightning-tab>
        <lightning-tab label="係数情報" value="keisu">
          <c-keisu data={keisuData}></c-keisu>
        </lightning-tab>
      </lightning-tabset>
    </div>
  </div>
</template>
