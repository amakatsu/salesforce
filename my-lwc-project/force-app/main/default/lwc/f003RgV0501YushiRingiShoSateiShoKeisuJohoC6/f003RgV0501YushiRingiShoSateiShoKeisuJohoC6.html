<template>
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name={activeSections}
  >
    <!-- 計数サマリー・補正理由等 -->
    <lightning-accordion-section
      name="c"
      label="計数サマリー・補正理由等"
      icon-name="standard:choice"
    >
      <lightning-card>
        <div class="slds-grid slds-gutters slds-var-p-horizontal_small slds-grid_vertical-align-end">
          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <div class="slds-var-p-top_medium">
              <lightning-input type="text" label="禀査番号" value={reviewNumber} readonly></lightning-input>
            </div>
          </div>
          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <div class="slds-var-p-top_medium">
              <lightning-input type="text" label="基準日" value={referenceDate} readonly></lightning-input>
            </div>
          </div>

          <div class="slds-col slds-size_4-of-12">
            <!-- ヘッダー行 -->
            <div
              class="slds-grid slds-grid_align-spread slds-var-p-horizontal_xx-small slds-grid_vertical-align-end"
            >
              <span class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-top_x-small">計数サマリー</span>
              <span>金額単位：〇〇〇</span>
            </div>
            <!-- BOX本体 -->
            <div class="slds-box slds-box_small slds-var-m-bottom_none slds-var-p-bottom_none">
              <div class="slds-grid slds-gutters slds-var-p-horizontal_small slds-grid_vertical-align-end">
                <div class="slds-size_6-of-12">
                  <label class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-top_x-small">限度算入</label>
                  <div class="slds-box slds-box_small">
                    <div class="slds-grid slds-gutters">
                      <div class="slds-col slds-size_6-of-12">
                        <div class="slds-form-element">
                          <label class="slds-form-element__label">一般</label>
                          <div class="slds-form-element__control slds-text-align_right slds-border_bottom">
                            <lightning-formatted-number value={generalCreditLimit}></lightning-formatted-number>
                          </div>
                        </div>
                      </div>
                      <div class="slds-col slds-size_6-of-12">
                        <div class="slds-form-element">
                          <label class="slds-form-element__label">市場性</label>
                          <div class="slds-form-element__control slds-text-align_right slds-border_bottom">
                            <lightning-formatted-number value={marketCreditInclusion}></lightning-formatted-number>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="slds-col slds-size_3-of-12 slds-var-p-top_x-large">
                  <div class="slds-form-element">
                    <label class="slds-form-element__label">規定担保</label>
                    <div class="slds-form-element__control slds-text-align_right slds-border_bottom">
                      <lightning-formatted-number value={regulatoryCollateral}></lightning-formatted-number>
                    </div>
                  </div>
                </div>
                <div class="slds-col slds-size_3-of-12 slds-var-p-top_x-large">
                  <div class="slds-form-element">
                    <label class="slds-form-element__label">保全率(％)</label>
                    <div class="slds-form-element__control slds-text-align_right slds-border_bottom">
                      <lightning-formatted-number value={protectionRate}></lightning-formatted-number>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <div class="slds-var-p-top_medium">
              <lightning-input type="text" label="プール区分" value={poolCategory} readonly></lightning-input>
            </div>
          </div>
          <div class="slds-col slds-size_4-of-12">
            <lightning-textarea
              label="補正理由"
              value={correctionReason}
              max-length="105"
              style="--sds-c-textarea-sizing-min-height: 6rem"
            ></lightning-textarea>
          </div>
        </div>
      </lightning-card>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
