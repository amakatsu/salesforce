<template>
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name={activeSections}
  >
    <!-- 計数サマリー・補正理由等 -->
    <lightning-accordion-section
      name="c"
      label="計数サマリー・補正理由等"
      icon-name="standard:choice"
    >
      <lightning-card>
        <div class="slds-grid slds-gutters slds-var-p-horizontal_small c6-layout">
          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <lightning-input
              label="禀査番号"
              value={reviewNumber}
              readonly
              class="underline slds-var-p-top_medium"
            ></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <lightning-input
              label="基準日"
              value={date}
              readonly
              class="underline slds-var-p-top_medium"
            ></lightning-input>
          </div>

          <div class="slds-col slds-size_4-of-12 summary-panel">
            <!-- ヘッダー行 -->
            <div
              class="slds-grid slds-grid_align-spread slds-var-p-horizontal_xx-small meta-header"
            >
              <span class="section-label">計数サマリー</span>
              <span class="summary-unit">金額単位：〇〇〇</span>
            </div>
            <!-- BOX本体 -->
            <div class="slds-box slds-box_small slds-var-m-bottom_none slds-var-p-bottom_none">
              <div class="slds-grid slds-gutters slds-var-p-horizontal_small">
                <div class="slds-size_6-of-12">
                  <label class="section-label">限度算入</label>
                  <div class="slds-box slds-box_small">
                    <div class="slds-grid slds-gutters">
                      <div class="slds-col slds-size_6-of-12">
                        <c-f003-gs-v0000-number
                          num-value={limitGeneral}
                          num-label="一般"
                          disabled
                        ></c-f003-gs-v0000-number>
                      </div>
                      <div class="slds-col slds-size_6-of-12">
                        <c-f003-gs-v0000-number
                          num-value={marketInclusion}
                          num-label="市場性"
                          disabled
                        ></c-f003-gs-v0000-number>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="slds-col slds-size_3-of-12 slds-var-p-top_x-large">
                  <c-f003-gs-v0000-number
                    num-value={regulatoryCollateral}
                    num-label="規定担保"
                    disabled
                  ></c-f003-gs-v0000-number>
                </div>
                <div class="slds-col slds-size_3-of-12 slds-var-p-top_x-large">
                  <c-f003-gs-v0000-number
                    num-value={protectionRate}
                    num-label="保全率(％)"
                    disabled
                  ></c-f003-gs-v0000-number>
                </div>
              </div>
            </div>
          </div>

          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <lightning-input
              label="プール区分"
              value={poolCategory}
              readonly
              class="underline slds-var-p-top_medium"
            ></lightning-input>
          </div>
          <div class="slds-col slds-size_4-of-12 summary-panel">
            <lightning-textarea
              label="補正理由"
              value={correctionReason}
              max-length="105"
              class="correction-reason"
              style="--sds-c-textarea-sizing-min-height: 6rem"
            ></lightning-textarea>
          </div>
        </div>
      </lightning-card>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
