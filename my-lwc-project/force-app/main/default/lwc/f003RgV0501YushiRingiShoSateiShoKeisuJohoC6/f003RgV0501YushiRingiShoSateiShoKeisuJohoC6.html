<template>
  <lightning-accordion
    allow-multiple-sections-open
    active-section-name={activeSections}
  >
    <!-- 案件サマリー・補正理由等 -->
    <lightning-accordion-section
      name="c"
      label="案件サマリー・補正理由等"
      icon-name="standard:choice"
    >
      <lightning-card>
        <div class="slds-grid slds-gutters slds-var-p-horizontal_small">
          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <div class="slds-col slds-size_12-of-12 slds-var-p-top_medium">
              <lightning-input
                label="禀査番号"
                value={reviewNumber}
                readonly
                class="underline"
              ></lightning-input>
            </div>
          </div>
          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <div class="slds-col slds-size_12-of-12 slds-var-p-top_medium">
              <lightning-input
                label="基準日"
                value={date}
                readonly
                class="underline"
              ></lightning-input>
            </div>
          </div>

          <div class="summary-wrap slds-size_4-of-12">
            <!-- ヘッダー行 -->
            <div
              class="summary-header slds-grid slds-grid_align-spread slds-var-p-horizontal_xx-small"
            >
              <span class="label">計数サマリー</span>
              <span class="summary-unit">金額単位〇〇〇</span>
            </div>
            <!-- BOX本体 -->
            <div class="slds-box slds-box_small">
              <div class="slds-grid slds-gutters slds-var-p-horizontal_small">
                <div class="slds-size_6-of-12">
                  <label class="label">限度算入</label>
                  <div class="slds-box slds-box_small">
                    <div class="slds-grid slds-gutters">
                      <div class="slds-col slds-size_6-of-12">
                        <c-f003-gs-v0000-number
                          num-value={limitGeneral}
                          num-label="一般"
                          disabled
                        ></c-f003-gs-v0000-number>
                      </div>
                      <div class="slds-col slds-size_6-of-12">
                        <c-f003-gs-v0000-number
                          num-value={marketInclusion}
                          num-label="市場性"
                          disabled
                        ></c-f003-gs-v0000-number>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="slds-col slds-size_3-of-12 slds-var-p-top_x-large">
                  <c-f003-gs-v0000-number
                    num-value={regulatoryCollateral}
                    num-label="規定担保"
                    disabled
                  ></c-f003-gs-v0000-number>
                </div>
                <div class="slds-col slds-size_3-of-12 slds-var-p-top_x-large">
                  <c-f003-gs-v0000-number
                    num-value={protectionRate}
                    num-label="保全率(％)"
                    disabled
                  ></c-f003-gs-v0000-number>
                </div>
              </div>
            </div>
          </div>

          <div class="slds-col slds-size_1-of-12 slds-var-p-top_xx-large">
            <div class="slds-col slds-size_12-of-12 slds-var-p-top_medium">
              <lightning-input
                label="プール区分"
                value={poolCategory}
                readonly
                class="underline"
              ></lightning-input>
            </div>
          </div>
          <div class="slds-col slds-size_3-of-12">
            <lightning-layout-item flexibility="auto">
              <lightning-textarea
                label="補正理由"
                value={correctionReason}
                style="--sds-c-textarea-sizing-min-height: 5rem"
              ></lightning-textarea>
            </lightning-layout-item>
          </div>
        </div>
      </lightning-card>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
