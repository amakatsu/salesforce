<template>
    <lightning-accordion
        allow-multiple-sections-open
        active-section-name={activeSections}
    >
        <lightning-accordion-section
            name="b"
            label="Transaction Condition/本件条件"
            icon-name="standard:choice"
        >
            <lightning-card>
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="12">

                        <!-- Header Row for Labels -->
                        <lightning-layout class="slds-grid slds-p-horizontal_medium slds-text-title_caps">
                            <lightning-layout-item size="3" class="slds-col slds-text-title_caps">
                                Transaction Condition
                            </lightning-layout-item>
                            <lightning-layout-item size="3" class="slds-col slds-text-title_caps slds-m-left_small">
                                本件条件
                            </lightning-layout-item>
                        </lightning-layout>

                        <!-- Input Fields -->
                        <template for:each={conditions} for:item="condition">
                            <lightning-layout key={condition.id} multiple-rows>
                                <lightning-layout-item size="3" padding="around-small">
                                    <lightning-input
                                        label="Transaction Conditio"
                                        value={condition.transactionCondition}
                                        data-id={condition.id}
                                        data-field="transactionCondition"
                                        onchange={handleConditionChange}
                                        variant="label-hidden"
                                    ></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="3" padding="around-small">
                                    <lightning-combobox
                                        label="本件条件"
                                        value={condition.selectedCondition}
                                        options={conditionOptions}
                                        data-id={condition.id}
                                        data-field="selectedCondition"
                                        onchange={handleConditionChange}
                                        variant="label-hidden"
                                    ></lightning-combobox>
                                </lightning-layout-item>
                            </lightning-layout>
                        </template>

                    </lightning-layout-item>
                    <lightning-layout-item size="6" padding="around-small">
                        <lightning-textarea
                            label="本件条件コメント"
                            value={honkenJokenComment}
                            onchange={handleCommentChange}
                            style="--slds-c-textarea-sizing-min-height: calc(1.5rem * 5)"
                        ></lightning-textarea>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-card>
        </lightning-accordion-section>
    </lightning-accordion>
</template>
