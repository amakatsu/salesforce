<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マッチングアプリ - プロフィール一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
            margin: 20px auto;
            max-width: 1200px;
        }
        .profile-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .profile-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 3px solid #6c757d;
        }
        .profile-info {
            padding: 20px;
        }
        .profile-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .profile-details {
            color: #6c757d;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .interests-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .interest-tag {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .search-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #dee2e6;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        .spinner-border {
            color: #667eea;
        }
        .header-title {
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }
        .no-results {
            text-align: center;
            color: #6c757d;
            padding: 40px;
        }
        .btn-gradient {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
        }
        .btn-gradient:hover {
            background: linear-gradient(45deg, #764ba2, #667eea);
            color: white;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1 class="header-title">💕 マッチングアプリ - プロフィール一覧</h1>
        
        <!-- 検索フィルター -->
        <div class="search-container">
            <h5 class="mb-3"><i class="bi bi-search"></i> 検索条件</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">最小年齢</label>
                    <input type="number" class="form-control" id="minAge" min="18" max="100" value="18">
                </div>
                <div class="col-md-3">
                    <label class="form-label">最大年齢</label>
                    <input type="number" class="form-control" id="maxAge" min="18" max="100" value="50">
                </div>
                <div class="col-md-3">
                    <label class="form-label">性別</label>
                    <select class="form-select" id="gender">
                        <option value="">すべて</option>
                        <option value="male">男性</option>
                        <option value="female">女性</option>
                        <option value="other">その他</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">居住地</label>
                    <input type="text" class="form-control" id="location" placeholder="例：東京">
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <label class="form-label">趣味</label>
                    <div id="interests" class="d-flex flex-wrap gap-2">
                        <!-- 趣味のチェックボックスがここに動的に追加される -->
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12 d-flex gap-2">
                    <button type="button" class="btn btn-gradient" onclick="searchProfiles()">
                        <i class="bi bi-search"></i> 検索
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="resetFilters()">
                        <i class="bi bi-arrow-clockwise"></i> リセット
                    </button>
                    <button type="button" class="btn btn-outline-primary" onclick="loadAllProfiles()">
                        <i class="bi bi-list"></i> 全件表示
                    </button>
                </div>
            </div>
        </div>

        <!-- 結果表示エリア -->
        <div id="results-info" class="mb-3" style="display: none;">
            <small class="text-muted">検索結果: <span id="results-count">0</span>件</small>
        </div>

        <!-- ローディング表示 -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">読み込み中...</span>
            </div>
        </div>

        <!-- プロフィール一覧 -->
        <div id="profiles-container" class="row">
            <!-- プロフィールカードがここに動的に追加される -->
        </div>

        <!-- 結果なし表示 -->
        <div id="no-results" class="no-results" style="display: none;">
            <i class="bi bi-search" style="font-size: 3rem; color: #dee2e6;"></i>
            <h4>プロフィールが見つかりませんでした</h4>
            <p>検索条件を変更してもう一度お試しください。</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = '/api/user-profiles';
        const availableInterests = [
            '映画', '音楽', '料理', '旅行', 'スポーツ', '読書', 
            'ゲーム', 'アート', 'アウトドア', 'カフェ巡り', 'ペット', '写真',
            'ダンス', 'ヨガ', 'フィットネス', 'DIY', 'キャンプ', 'ライブ', 
            'アニメ', 'お菓子作り'
        ];

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', function() {
            initializeInterests();
            loadAllProfiles();
        });

        // 趣味チェックボックスの初期化
        function initializeInterests() {
            const interestsContainer = document.getElementById('interests');
            availableInterests.forEach(interest => {
                const checkContainer = document.createElement('div');
                checkContainer.className = 'form-check form-check-inline';
                checkContainer.innerHTML = `
                    <input class="form-check-input" type="checkbox" id="interest-${interest}" value="${interest}">
                    <label class="form-check-label" for="interest-${interest}">${interest}</label>
                `;
                interestsContainer.appendChild(checkContainer);
            });
        }

        // 全プロフィール読み込み
        async function loadAllProfiles() {
            showLoading();
            try {
                const response = await fetch(API_BASE_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const profiles = await response.json();
                displayProfiles(profiles);
                updateResultsInfo(profiles.length);
            } catch (error) {
                console.error('Error loading profiles:', error);
                showError('プロフィールの読み込みに失敗しました。');
            } finally {
                hideLoading();
            }
        }

        // プロフィール検索
        async function searchProfiles() {
            const searchCriteria = {
                minAge: document.getElementById('minAge').value ? parseInt(document.getElementById('minAge').value) : null,
                maxAge: document.getElementById('maxAge').value ? parseInt(document.getElementById('maxAge').value) : null,
                gender: document.getElementById('gender').value || null,
                location: document.getElementById('location').value || null,
                interests: getSelectedInterests()
            };

            // 空の条件を除去
            Object.keys(searchCriteria).forEach(key => {
                if (searchCriteria[key] === null || searchCriteria[key] === '' || 
                    (Array.isArray(searchCriteria[key]) && searchCriteria[key].length === 0)) {
                    delete searchCriteria[key];
                }
            });

            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(searchCriteria)
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                const profiles = await response.json();
                displayProfiles(profiles);
                updateResultsInfo(profiles.length);
            } catch (error) {
                console.error('Error searching profiles:', error);
                showError('検索に失敗しました。');
            } finally {
                hideLoading();
            }
        }

        // 選択された趣味を取得
        function getSelectedInterests() {
            const checkboxes = document.querySelectorAll('#interests input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // プロフィール表示
        function displayProfiles(profiles) {
            const container = document.getElementById('profiles-container');
            const noResults = document.getElementById('no-results');
            
            container.innerHTML = '';
            
            if (profiles.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            
            profiles.forEach(profile => {
                const profileCard = createProfileCard(profile);
                container.appendChild(profileCard);
            });
        }

        // プロフィールカード作成
        function createProfileCard(profile) {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            
            const photoUrl = profile.photos && profile.photos.length > 0 ? 
                profile.photos[0] : 'https://via.placeholder.com/300x250?text=No+Photo';
            
            const interestsTags = profile.interests ? 
                profile.interests.map(interest => `<span class="interest-tag">${interest}</span>`).join('') : '';
                
            const age = profile.age || '不明';
            const location = profile.location || '非公開';
            const occupation = profile.occupation || '非公開';
            const education = profile.education || '非公開';
            const lookingFor = profile.lookingFor || '友達';
            const bio = profile.bio || '自己紹介がありません。';
            
            col.innerHTML = `
                <div class="profile-card">
                    <img src="${photoUrl}" alt="${profile.name}" class="profile-image" 
                         onerror="this.src='https://via.placeholder.com/300x250?text=No+Photo'">
                    <div class="profile-info">
                        <div class="profile-name">
                            <i class="bi bi-person-circle"></i> ${profile.name} (${age}歳)
                        </div>
                        <div class="profile-details">
                            <div class="mb-1">
                                <i class="bi bi-geo-alt"></i> <strong>居住地:</strong> ${location}
                            </div>
                            <div class="mb-1">
                                <i class="bi bi-briefcase"></i> <strong>職業:</strong> ${occupation}
                            </div>
                            <div class="mb-1">
                                <i class="bi bi-mortarboard"></i> <strong>学歴:</strong> ${education}
                            </div>
                            <div class="mb-1">
                                <i class="bi bi-heart"></i> <strong>探している関係:</strong> ${lookingFor}
                            </div>
                            <div class="mb-2">
                                <i class="bi bi-chat-quote"></i> <strong>自己紹介:</strong> ${bio}
                            </div>
                            <div class="interests-tags">
                                ${interestsTags}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return col;
        }

        // フィルターリセット
        function resetFilters() {
            document.getElementById('minAge').value = '18';
            document.getElementById('maxAge').value = '50';
            document.getElementById('gender').value = '';
            document.getElementById('location').value = '';
            
            // 全チェックボックスをオフ
            document.querySelectorAll('#interests input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
            });
            
            loadAllProfiles();
        }

        // 結果情報更新
        function updateResultsInfo(count) {
            document.getElementById('results-count').textContent = count;
            document.getElementById('results-info').style.display = 'block';
        }

        // ローディング表示
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('profiles-container').style.display = 'none';
            document.getElementById('no-results').style.display = 'none';
        }

        // ローディング非表示
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('profiles-container').style.display = 'flex';
        }

        // エラー表示
        function showError(message) {
            document.getElementById('profiles-container').innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger text-center" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> ${message}
                    </div>
                </div>
            `;
            document.getElementById('profiles-container').style.display = 'flex';
        }
    </script>
</body>
</html>
