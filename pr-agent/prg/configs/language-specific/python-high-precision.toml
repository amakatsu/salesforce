# =============================================================================
# Python プロジェクト専用 高精度レビュー設定
# =============================================================================

[config]
# 高性能モデル設定
model = "o1-preview"
fallback_models = ["gpt-4-turbo", "claude-3-5-sonnet-20241022"]
temperature = 0.0
reasoning_effort = "high"
response_language = "ja-JP"

# Python専用トークン設定
max_model_tokens = 128000
patch_extra_lines_before = 15      # Pythonは関数・クラス定義が長いため
patch_extra_lines_after = 5
allow_dynamic_context = true

# Python固有の除外設定
patch_extension_skip_types = [
    ".md", ".txt", ".json", ".yml", ".yaml",
    ".pyc", ".pyo", ".pyd", "__pycache__",
    ".egg-info", ".whl", ".log",
    "requirements*.txt", "poetry.lock", "Pipfile.lock"
]

[pr_reviewer]
# 全評価要素有効
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
require_can_be_split_review = true

# Python専用レビュー指示
extra_instructions = """
【🐍 Python 高精度レビューガイドライン】

## 📋 第1段階: Python コード品質分析

### 🎯 PEP準拠度チェック
1. **PEP 8 コーディングスタイル**
   - インデント（4スペース）
   - 行長（88文字推奨、Black準拠）
   - インポート順序（isort準拠）
   - 命名規則（snake_case、CONSTANT、ClassName）

2. **PEP 257 Docstring規約**
   - モジュール、クラス、関数のDocstring
   - Google Style vs NumPy Style統一
   - 引数・戻り値・例外の説明

3. **Type Hints (PEP 484, 526, 563)**
   - 関数シグネチャの型注釈
   - 変数の型注釈（必要時）
   - Union、Optional、Generic適切使用
   - mypy互換性確認

### 🔍 Python固有コード解析
1. **Pythonic実装確認**
   ```python
   # Good: List comprehension
   result = [x*2 for x in data if x > 0]

   # Bad: Traditional loop
   result = []
   for x in data:
       if x > 0:
           result.append(x*2)
   ```

2. **イディオム・ベストプラクティス**
   - `with`文（コンテキストマネージャ）
   - `enumerate()`, `zip()`, `reversed()`適切使用
   - `*args`, `**kwargs`の使い分け
   - デコレータ活用（`@property`, `@staticmethod`等）

## 🔒 第2段階: セキュリティ分析

### 🛡️ Python特有セキュリティリスク
1. **インジェクション攻撃対策**
   ```python
   # 危険: SQL injection
   query = f"SELECT * FROM users WHERE id = {user_id}"

   # 安全: Parameterized query
   query = "SELECT * FROM users WHERE id = %s"
   cursor.execute(query, (user_id,))
   ```

2. **危険な組み込み関数**
   - `eval()`, `exec()`, `compile()`使用禁止
   - `pickle.loads()`の安全性確認
   - `subprocess`の適切な使用

3. **ファイル・パス操作**
   ```python
   # 危険: Path traversal
   file_path = user_input

   # 安全: pathlib使用
   from pathlib import Path
   safe_path = Path(base_dir) / Path(user_input).name
   ```

### 🔐 機密情報管理
1. **環境変数・設定管理**
   - `.env`ファイルの.gitignore登録
   - `python-decouple`, `pydantic-settings`使用
   - ハードコード禁止（API Key、Password等）

2. **ログ出力安全性**
   ```python
   # 危険: 機密情報ログ出力
   logger.info(f"User login: {username}:{password}")

   # 安全: 機密情報除外
   logger.info(f"User login: {username}:***")
   ```

## ⚡ 第3段階: パフォーマンス分析

### 🚀 Python最適化チェック
1. **データ構造選択**
   - `list` vs `tuple` vs `set` vs `dict`適切選択
   - `collections.deque`, `collections.Counter`活用
   - `pandas.DataFrame`の効率的操作

2. **アルゴリズム効率性**
   ```python
   # O(n²) - 非効率
   for i in list1:
       if i in list2:  # list2をO(n)で検索
           result.append(i)

   # O(n) - 効率的
   set2 = set(list2)  # O(1)検索のためのset変換
   result = [i for i in list1 if i in set2]
   ```

3. **メモリ使用最適化**
   - Generator vs List comprehension
   - `__slots__`使用検討
   - 大容量データのチャンク処理

### 🔄 非同期処理（asyncio）
1. **async/await適切使用**
   ```python
   # 同期的I/O（改善対象）
   def fetch_data():
       response = requests.get(url)
       return response.json()

   # 非同期I/O（推奨）
   async def fetch_data():
       async with aiohttp.ClientSession() as session:
           async with session.get(url) as response:
               return await response.json()
   ```

2. **並行処理の選択**
   - CPU集約: `multiprocessing`
   - I/O集約: `asyncio`
   - 混合: `concurrent.futures`

## 🧪 第4段階: テスト品質評価

### 📊 テストカバレッジ分析
1. **pytest規約準拠**
   ```python
   # テストファイル命名: test_*.py
   # テスト関数命名: test_*
   # Fixture活用度
   # パラメータ化テスト（@pytest.mark.parametrize）
   ```

2. **カバレッジ目標**
   - Line coverage: 90%以上
   - Branch coverage: 85%以上
   - Critical path: 100%

3. **テスト品質チェック**
   ```python
   # Good: 独立性のあるテスト
   def test_user_creation():
       user = User("test@example.com")
       assert user.email == "test@example.com"

   # Bad: 外部依存のあるテスト
   def test_database_user():
       user = db.users.find_one()  # 外部状態に依存
       assert user.is_active
   ```

### 🎭 Mock・Stub使用評価
1. **適切なMock使用**
   ```python
   # 外部API呼び出しのMock
   @patch('requests.get')
   def test_api_call(mock_get):
       mock_get.return_value.json.return_value = {"status": "ok"}
       result = api_client.fetch_status()
       assert result["status"] == "ok"
   ```

## 📚 第5段階: ライブラリ・フレームワーク評価

### 🌐 Django/FastAPI/Flask固有チェック
1. **Django固有**
   - Model定義（Meta class、__str__メソッド）
   - Migration安全性
   - ORM最適化（select_related、prefetch_related）
   - CSRF、XSS対策確認

2. **FastAPI固有**
   - Pydantic model使用
   - Dependency Injection活用
   - OpenAPI documentation
   - 非同期エンドポイント

3. **共通Web セキュリティ**
   - CORS設定適切性
   - 認証・認可実装
   - Rate limiting
   - Input validation

### 📦 依存関係管理
1. **requirements.txt / pyproject.toml**
   - バージョン固定の適切性
   - セキュリティ脆弱性チェック（safety, bandit）
   - 未使用依存関係の除去

2. **仮想環境管理**
   - venv、poetry、pipenv適切使用
   - Python version管理

## 📊 第6段階: 総合評価

### 🎯 スコア評価（各項目1-10点）
- **コード品質**: PEP準拠度、Pythonic度
- **セキュリティ**: 脆弱性対策度
- **パフォーマンス**: 効率性、スケーラビリティ
- **テスト品質**: カバレッジ、テスト設計
- **保守性**: 可読性、拡張性

### ✅ Python専用承認基準
**🎯 総合スコア 8.0/10 以上で承認推奨**

必須条件：
- mypy型チェック エラー0件
- pytest テスト 全件PASS
- flake8/black 警告0件
- セキュリティ脆弱性 0件

推奨条件：
- テストカバレッジ 90%以上
- Docstring カバレッジ 80%以上
- 循環的複雑度 10以下
"""

# Python専用提案設定
num_code_suggestions = 10
suggestions_score_threshold = 8
persistent_comment = true

[pr_code_suggestions]
max_context_tokens = 32000
commitable_code_suggestions = true
focus_only_on_problems = false

extra_instructions = """
【🐍 Python コード改善提案指示】

## 🎯 提案品質基準
