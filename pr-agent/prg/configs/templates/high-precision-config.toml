"""

# =============================================================================
# 高精度品質チェック設定
# =============================================================================

# 厳格な無視設定（高品質コードのみ分析対象）
[config]
ignore_pr_title = [
    "^\\[WIP\\]", "^WIP:", "^Draft:", "^TEST:", "^TEMP:"
]
patch_extension_skip_types = [
    ".md", ".txt", ".json", ".yml", ".yaml",
    ".log", ".lock", ".gitignore",
    ".png", ".jpg", ".gif", ".svg", ".ico"
]

# 高精度Git設定
[github]
deployment_type = "app"                    # アプリケーション統合
publish_inline_comments_fallback_with_verification = true
try_fix_invalid_inline_comments = true     # コメント最適化

# 高精度ログ設定
[config]
log_level = "INFO"                         # 詳細ログ（DEBUGは冗長すぎる）
output_relevant_configurations = true      # 設定情報出力