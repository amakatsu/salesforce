# =============================================================================
# PR-Agent 高精度レビュー設定
# =============================================================================
# レビューの精度を最大限に向上させるための専用設定ファイル

[config]
# -----------------------------------------------------------------------------
# 高精度AIモデル設定
# -----------------------------------------------------------------------------
model = "o1-preview"                       # 最高性能の推論モデル
fallback_models = [                       # 高性能フォールバック
    "gpt-4-turbo",
    "gpt-4",
    "claude-3-5-sonnet-20241022"
]
model_reasoning = "o1-preview"             # 推論専用：複雑な分析用
model_weak = "gpt-4o-mini"                 # 軽量タスクも高品質モデル

# -----------------------------------------------------------------------------
# 精度重視の応答制御
# -----------------------------------------------------------------------------
temperature = 0.0                          # 最も保守的・一貫性重視
seed = 42                                  # 再現性確保
reasoning_effort = "high"                  # 最高レベルの推論努力
ai_timeout = 300                           # 十分な処理時間（5分）

# -----------------------------------------------------------------------------
# 高精度トークン設定
# -----------------------------------------------------------------------------
max_model_tokens = 128000                  # 大容量モデルを最大活用
max_description_tokens = 1000              # 詳細なPR説明
max_commits_tokens = 1000                  # 十分なコミット情報
patch_extra_lines_before = 10              # 広いコンテキスト
patch_extra_lines_after = 5               # 影響範囲も含めて分析
allow_dynamic_context = true              # 動的コンテキスト拡張
max_extra_lines_before_dynamic_context = 20  # 関数・クラス全体を把握

# -----------------------------------------------------------------------------
# 厳格なレビュー設定
# -----------------------------------------------------------------------------
response_language = "ja-JP"                # 日本語で詳細レビュー
verbosity_level = 2                        # 最大詳細度
large_patch_policy = "clip"                # 大きなパッチも分析
duplicate_prompt_examples = true           # プロンプト例の重複で強調

# =============================================================================
# 高精度PRレビュー設定 [pr_reviewer]
# =============================================================================
[pr_reviewer]

# -----------------------------------------------------------------------------
# 全レビュー要素を有効化
# -----------------------------------------------------------------------------
require_score_review = true                # スコア評価：必須
require_tests_review = true                # テストレビュー：必須
require_estimate_effort_to_review = true   # 工数見積もり：必須
require_can_be_split_review = true         # 分割可能性：必須
require_focused_review = true              # 集中レビューモード
require_security_review = true             # セキュリティレビュー
require_performance_review = true          # パフォーマンスレビュー

# -----------------------------------------------------------------------------
# 高精度カスタマイズ指示
# -----------------------------------------------------------------------------
extra_instructions = """
【🎯 高精度レビューガイドライン】

あなたは20年以上の経験を持つシニアアーキテクトです。
以下の段階的プロセスでコードを徹底的にレビューしてください：

## 📋 第1段階：構造分析
1. **アーキテクチャ影響度評価**
   - 既存システムへの影響範囲
   - 依存関係の変更による波及効果
   - 設計原則（SOLID、DRY、KISS）への準拠度

2. **コード品質メトリクス**
   - 循環的複雑度（10以下を推奨）
   - 関数・クラスサイズの適切性
   - ネストレベル（4層以下を推奨）

## 🔒 第2段階：セキュリティ分析
1. **OWASP Top 10 チェック**
   - インジェクション攻撃耐性
   - 認証・認可の実装確認
   - 機密データの取り扱い
   - セキュアな通信の実装

2. **入力検証・エラーハンドリング**
   - 全入力値の検証状況
   - 例外処理の適切性
   - エラーメッセージでの情報漏洩防止

## ⚡ 第3段階：パフォーマンス分析
1. **アルゴリズム効率性**
   - 時間計算量・空間計算量
   - データ構造の選択適切性
   - 不要な処理・重複処理の特定

2. **リソース使用最適化**
   - メモリリーク可能性
   - データベースクエリ効率
   - ネットワーク通信最適化

## 🧪 第4段階：テスト品質評価
1. **テストカバレッジ分析**
   - ユニットテストの充実度
   - エッジケースのカバー状況
   - 統合テストの必要性

2. **テスト品質評価**
   - テストの独立性
   - モックの適切な使用
   - テストの保守性

## 📚 第5段階：保守性・可読性
1. **コード可読性**
   - 命名の一貫性・明確性
   - コメントの適切性
   - コードの自己説明性

2. **保守性評価**
   - 変更の容易性
   - 機能拡張の考慮
   - リファクタリングの必要性

## 🎨 第6段階：言語・フレームワーク固有チェック
### Python固有
- PEP8準拠度
- Type Hintsの使用
- Pythonic な書き方
- 適切なライブラリ使用

### JavaScript/TypeScript固有
- ESLint/TSLint準拠
- 非同期処理の適切性
- DOM操作のセキュリティ
- バンドルサイズへの影響

### Java固有
- チェック例外処理
- ガベージコレクション考慮
- スレッドセーフティ
- Spring Boot規約準拠

### Go固有
- Go routines の適切な使用
- Channel の正しい使い方
- Error handling パターン
- Go modules の管理

## 📊 第7段階：総合評価とランキング
各項目を1-10点で評価し、以下の形式で出力：

**🎯 総合スコア: X.X/10**

**📋 詳細評価**
- セキュリティ: X/10
- パフォーマンス: X/10
- 可読性: X/10
- テスト品質: X/10
- 保守性: X/10

**⚠️ 重要度別課題**
🚨 **Critical (必須対応)**
- [具体的な問題と修正方法]

⚠️ **High (推奨対応)**
- [具体的な改善提案]

💡 **Medium (検討推奨)**
- [最適化案・ベストプラクティス]

**✅ 承認条件**
Critical課題が0件、かつ総合スコア7.0以上で承認推奨
"""

# -----------------------------------------------------------------------------
# 高精度提案設定
# -----------------------------------------------------------------------------
num_code_suggestions = 8                   # より多くの提案
suggestions_score_threshold = 8            # 厳格な閾値
persistent_comment = true                  # 永続的な記録
enable_help_text = true                    # 詳細なヘルプ
enable_review_labels_effort = true         # 工数ラベル
enable_review_labels_security = true       # セキュリティラベル

# -----------------------------------------------------------------------------
# 詳細出力設定
# -----------------------------------------------------------------------------
inline_file_summary = "table"             # テーブル形式でファイル情報
collapsible_file_list = "adaptive"        # 適応的な折りたたみ
collapsible_file_list_threshold = 3       # 少ないファイル数でも詳細表示

# =============================================================================
# 高精度コード改善提案 [pr_code_suggestions]
# =============================================================================
[pr_code_suggestions]

# -----------------------------------------------------------------------------
# 最大精度の分析設定
# -----------------------------------------------------------------------------
max_context_tokens = 32000                 # 最大コンテキスト活用
commitable_code_suggestions = true         # すぐに適用可能な提案
focus_only_on_problems = false             # 問題＋改善提案両方
suggestions_score_threshold = 8            # 高品質提案のみ採用
dual_publishing_score_threshold = 9        # 最重要提案の二重公開

# -----------------------------------------------------------------------------
# 高精度提案指示
# -----------------------------------------------------------------------------
extra_instructions = """
【🔬 高精度コード分析指示】

## 🎯 分析深度
各行のコード変更について、以下の3層分析を実施：

### Layer 1: 直接的影響分析
- その行の変更が与える直接的な影響
- 型安全性・nullセーフティの確保
- API契約の変更有無

### Layer 2: 関数・クラスレベル影響
- 変更が所属する関数・クラスへの影響
- 呼び出し元への波及効果
- インターフェース変更の必要性

### Layer 3: システム全体影響
- アーキテクチャへの影響
- パフォーマンス全体への影響
- セキュリティポリシーへの影響

## 🛠️ 提案品質基準
各提案は以下を満たすこと：

### 具体性（Score: 9-10）
- 具体的なコード例を提示
- Before/After の明確な比較
- 変更手順の詳細説明

### 実用性（Score: 8-10）
- 即座に適用可能
- 副作用のリスク評価済み
- テストコードも含めた提案

### 教育的価値（Score: 7-10）
- なぜその変更が必要かの説明
- ベストプラクティスの引用
- 将来の拡張性への言及

## 📋 提案カテゴリ
各提案を以下のカテゴリで分類：

🚨 **Security Fix** (Priority: 1)
- セキュリティ脆弱性の修正
- 攻撃手法と対策の説明

⚡ **Performance Optimization** (Priority: 2)
- 計算量改善
- メモリ使用量削減
- I/O効率化

🔧 **Code Quality** (Priority: 3)
- 可読性向上
- 保守性改善
- テスタビリティ向上

💡 **Best Practice** (Priority: 4)
- 言語・フレームワーク慣習
- デザインパターン適用
- 将来の拡張性考慮
"""

# -----------------------------------------------------------------------------
# 高精度適用設定
# -----------------------------------------------------------------------------
apply_suggestions_checkbox = true          # 適用チェックボックス
max_history_len = 8                        # 長期履歴保持
persistent_comment = true                  # 永続コメント
enable_chat_text = true                    # チャット形式の詳細説明

# =============================================================================
# 高精度PR説明生成 [pr_description]
# =============================================================================
[pr_description]

# -----------------------------------------------------------------------------
# 詳細説明生成
# -----------------------------------------------------------------------------
generate_ai_title = true                   # AI最適化タイトル
use_bullet_points = true                   # 構造化された説明
enable_pr_type = true                      # 詳細なPR分類
enable_semantic_files_types = true         # ファイル種別の意味解析
add_original_user_description = true       # 元説明保持
enable_pr_diagram = true                   # 変更図表示

# -----------------------------------------------------------------------------
# 高精度説明指示
# -----------------------------------------------------------------------------
extra_instructions = """
【📋 高精度PR説明生成指示】

## 🎯 説明構造
以下の構造で詳細なPR説明を生成：

### 📋 変更概要
- **目的**: なぜこの変更が必要か
- **手法**: どのように実装したか
- **影響**: 何が変わるか

### 🔍 技術詳細
- **アーキテクチャ変更**: システム設計への影響
- **API変更**: インターフェースの変更点
